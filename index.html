<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffe9d6">
<title>生仔要考牌</title>
<style>
:root{color-scheme:light;--wall:#ffe3c2;--wall2:#ffd2a1;--rug:#ff9fb8;--rug2:#ffc4d3;--curt:#7c6cf0;--ones:#ffd166;--shirt:#7c6cf0;--crib:#7fc8a9;--crib2:#a5ddc3;--ink:#3b2a4a;--pink:#ff4f7b;--card:#fffaf2;--soft:#efe6f5;--muted:#9a7fb0;--ok:#3fbfad}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Arial Rounded MT Bold","PingFang HK","Microsoft JhengHei","Noto Sans HK","Heiti TC",sans-serif;color:var(--ink);background:#f0b47c;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer}
#vp{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#ffe9d6 0 50%,#f0b47c 50%)}
#stage{position:absolute;left:0;top:0;width:1600px;height:800px;transform-origin:0 0;will-change:transform}
#stage.cam{transition:transform .45s cubic-bezier(.3,.8,.4,1)}
#bg{will-change:transform}
#bg{position:absolute;left:0;top:0;display:block}
.ent{position:absolute;left:0;top:0;touch-action:none;cursor:grab;will-change:transform;backface-visibility:hidden}
.ent.lift{filter:drop-shadow(0 22px 12px rgba(0,0,0,.28));z-index:6000!important;cursor:grabbing}
.ent.fall{transition:transform .42s cubic-bezier(.4,0,.8,.6)}
.ent.glide{transition:transform .6s ease-in-out}
.ent.walk{transition:transform 1.9s ease-in-out}
.item{width:72px;height:72px;display:flex;align-items:flex-end;justify-content:center;font-size:54px;line-height:1}
.item .em{display:block}
.item:before{content:"";position:absolute;left:22%;right:22%;bottom:-3px;height:9px;border-radius:50%;background:rgba(0,0,0,.13)}
svg,img{-webkit-user-drag:none;-webkit-touch-callout:none}
.item.float .em{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.item.hot .em,.item.hot svg{animation:wiggle .5s ease-in-out infinite}
@keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.hs{position:absolute;cursor:pointer;border-radius:16px}
.over{position:absolute;pointer-events:none}
#night{position:absolute;left:0;top:0;width:1600px;height:800px;background:rgba(20,16,64,.56);opacity:0;pointer-events:none;transition:opacity .7s;z-index:4000}
.off #night{opacity:1}
#lampGlow{transition:opacity .5s}
.off #lampGlow{opacity:0}
#curtL,#curtR{transform-box:fill-box;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
#curtL{transform-origin:0 50%}#curtR{transform-origin:100% 50%}
.cOpen #curtL,.cOpen #curtR{transform:scaleX(.32)}
#binLid,#toyLid{transform-box:fill-box;transform-origin:0 100%;transition:transform .25s}
.binOpen #binLid{transform:rotate(-38deg)}
.boxOpen #toyLid{transform:rotate(-40deg)}
#mobile{transform-origin:50% 0;transform-box:fill-box}
.spin #mobile{animation:mob 1.6s ease-in-out infinite}
@keyframes mob{25%{transform:rotate(5deg)}75%{transform:rotate(-5deg)}}
#mobArm{transform-box:fill-box;transform-origin:50% 0}
.spin #mobArm{animation:mobArm .8s linear infinite}
@keyframes mobArm{50%{transform:scaleX(-1)}}
.radioOn #radio{animation:radio .3s ease-in-out infinite alternate}
@keyframes radio{to{transform:translateY(-3px)}}
#radio{transform-box:fill-box;transform-origin:50% 100%}
.mach #machLight{fill:#7dd87d}
.night #skyRect{fill:url(#skyN)}
.night #sunmoon{fill:#fff7cf}
.night #clouds{opacity:.25}
/* BB */
#bb{width:150px;height:170px}
#bb>svg.bbmain{display:block;width:100%;height:100%;overflow:visible;transform-origin:50% 100%;transition:scale .6s;animation:breathe 3s ease-in-out infinite}
.lite #bb>svg.bbmain{animation:none}
#pa svg{display:block;width:100%;height:100%;overflow:visible}
.ones{fill:var(--ones)}.skin{fill:#ffd6b8}
.bbbody{transform-origin:75px 164px;transform-box:view-box}
@keyframes breathe{50%{transform:scale(1.02,.98)}}
#bb.bounce .bbbody{animation:bounce .42s ease 3}
@keyframes bounce{40%{transform:translateY(-18px) scale(1.04,.96)}}
#bb.dance .bbbody{animation:dance .45s ease-in-out infinite alternate}
@keyframes dance{from{transform:rotate(-8deg)}to{transform:rotate(8deg) translateY(-8px)}}
#bb.roll .bbbody{animation:roll 1.4s ease-in-out}
@keyframes roll{0%{transform:none}50%{transform:translateX(40px) rotate(180deg) translateY(30px)}100%{transform:translateX(0) rotate(360deg)}}
#bb.shake .head{animation:shake .2s ease-in-out 5}
.head{transform-box:view-box;transform-origin:75px 100px}
@keyframes shake{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
#bb.cry .bbbody{animation:sob .5s ease-in-out infinite}
@keyframes sob{50%{transform:translateY(2px) scale(1.03,.97)}}
#bb.float .bbbody{animation:fl 1s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px)}}
.armL,.armR{transform-box:view-box;transition:transform .25s}
.armL{transform-origin:40px 104px}.armR{transform-origin:110px 104px}
#bb.hold .armL{transform:rotate(-40deg)}#bb.hold .armR{transform:rotate(40deg)}
#bb.wave .armR{animation:wave .3s ease-in-out 6 alternate}
@keyframes wave{from{transform:rotate(-20deg)}to{transform:rotate(-140deg)}}
.tear{animation:tear .7s ease-in infinite}
@keyframes tear{from{transform:translateY(0);opacity:1}to{transform:translateY(16px);opacity:0}}
#bb svg.stink{position:absolute;left:30px;top:-66px;width:90px;height:60px;display:none;pointer-events:none}
#bb.poop svg.stink{display:block}
.stink path{animation:stinkUp 1.4s ease-in-out infinite}
.stink path:nth-child(2){animation-delay:.45s}.stink path:nth-child(3){animation-delay:.9s}
@keyframes stinkUp{0%{transform:translateY(10px);opacity:0}40%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
.need{position:absolute;right:-26px;top:-34px;width:58px;height:58px;border-radius:50%;background:#fff;display:none;place-items:center;font-size:30px;box-shadow:0 5px 0 rgba(0,0,0,.12);animation:bob 1.6s ease-in-out infinite;pointer-events:none}
.need.show{display:grid}
#pa{width:170px;height:400px}
#pa .holdArms{display:none}
#pa.holding .holdArms{display:block}
#pa.holding .downArms{display:none}
#pa.wave .paArm{animation:paWave .35s ease-in-out 6 alternate}
.paArm{transform-box:view-box;transform-origin:126px 196px}
@keyframes paWave{to{transform:rotate(-120deg)}}
#strB,#strF{width:210px;height:190px}
#strF{pointer-events:none}
#strB.push svg,#strF.push svg{animation:pushBob .35s ease-in-out infinite alternate}
@keyframes pushBob{to{transform:translateY(-4px)}}
#bag{width:110px;height:110px}
#bag.gulp svg{animation:wiggle .4s}
/* 底部工具列 / 狀態 / 引導 */
#dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 10px);transform:translateX(-50%);display:flex;gap:6px;background:rgba(255,255,255,.92);padding:6px;border-radius:26px;box-shadow:0 6px 0 rgba(0,0,0,.12);z-index:10}
.dk{position:relative;border:0;background:transparent;border-radius:20px;min-width:62px;padding:4px 8px 6px;font-weight:900;font-size:12px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.dk span{font-size:24px;line-height:1.2}
.dk b{font-size:12px}.dk small{font-size:10px;color:var(--muted)}
.dk:active{background:var(--soft);transform:translateY(2px)}
.dk .dot{position:absolute;top:2px;right:8px;width:12px;height:12px;border-radius:50%;background:#ff4f7b;border:2px solid #fff;display:none}
.dk .dot.show{display:block;animation:hpulse 1.2s infinite}
#meters{display:flex;gap:8px;padding:7px 12px;pointer-events:none}
.mt{display:flex;align-items:center;gap:3px;font-size:14px}
.mt i{display:block;width:34px;height:8px;border-radius:6px;background:var(--soft);overflow:hidden}
.mt b{display:block;height:100%;border-radius:6px;transition:width .6s,background .6s}
.pan{position:fixed;top:50%;transform:translateY(-50%);z-index:9;border:0;width:42px;height:64px;border-radius:18px;background:rgba(255,255,255,.75);font-size:20px;font-weight:900;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.1);display:none}
.pan.show{display:block}
#panL{left:6px}#panR{right:6px}
.zh{position:absolute;border:5px dashed #ffd166;border-radius:28px;background:rgba(255,209,102,.16);pointer-events:none;z-index:3990;animation:zh 1s ease-in-out infinite alternate}
.zh b{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:#ffd166;color:var(--ink);border-radius:999px;padding:3px 12px;font-size:20px;white-space:nowrap}
.zh.bb{border-color:#7dd8b2;background:rgba(125,216,178,.18)}.zh.bb b{background:#7dd8b2}
@keyframes zh{to{opacity:.55}}
.coinfly{position:fixed;z-index:60;font-size:24px;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.4,.7,1),opacity .7s;will-change:transform}
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(#ffe9d6,#ffd6e0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:opacity .5s}
#splash .logo{font-size:72px;animation:hpulse 1s infinite}
#splash b{font-size:30px}#splash small{color:var(--muted);font-weight:800}
#splash .ld{width:180px;height:10px;border-radius:9px;background:#fff;overflow:hidden;margin-top:10px}
#splash .ld i{display:block;height:100%;width:30%;background:var(--pink);border-radius:9px;animation:ld 1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
#splash.out{opacity:0;pointer-events:none}
@media (max-width:520px){.dk{min-width:52px;padding:4px 4px 6px}#meters .mt i{width:24px}}
.sidedock #dock{left:auto;right:6px;top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column;padding:4px;gap:0}
.sidedock .dk{min-width:66px;padding:1px 4px}
.sidedock .dk span{font-size:18px}
.sidedock #tipbox{bottom:calc(env(safe-area-inset-bottom) + 8px);max-width:calc(100% - 110px)}
.sidedock #panR{right:90px}
.sidedock #rot{display:none!important}
/* 效能模式 */
.lite .bbbody,.lite .fan,.lite .need,.lite .item.float .em,.lite .stink path,.lite .tear,.lite .zh{animation:none!important}
.lite .item .em,.lite .ent.lift,.lite #bb{filter:none!important}
.lite .say,.lite .hb,.lite .dk{box-shadow:none!important}
.lite #night{transition:none}
/* BB 成長外觀 */
#bb .swaddle,#bb .cap,#bb .tooth{display:none}
#bb.st0 .swaddle,#bb.st1 .swaddle{display:block}
#bb.st0 .legs,#bb.st1 .legs,#bb.st0 .armL,#bb.st1 .armL,#bb.st0 .armR,#bb.st1 .armR,#bb.st0 .belly,#bb.st1 .belly,#bb.st0 .trait,#bb.st1 .trait{display:none}
#bb.st1 .cap{display:block}
#bb.st6 .tooth,#bb.st7 .tooth{display:block}
#bb.evolving{z-index:3960!important}
#bb.evolving svg.bbmain{animation:none;transition:scale .12s}
#bb.flash svg.bbmain{filter:brightness(0) invert(1) drop-shadow(0 0 18px #fff)}
#evoDim{position:absolute;left:0;top:0;width:1600px;height:800px;z-index:3950;pointer-events:none;opacity:0;transition:opacity .4s}
#evoDim.on{opacity:1}
.evoTxt{position:absolute;transform:translate(-50%,-50%);font-size:44px;font-weight:900;color:#fff;text-shadow:0 4px 0 #ff4f7b,0 0 20px #ff4f7b;z-index:3970;pointer-events:none;white-space:nowrap;animation:evoPop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes evoPop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
/* 成長條 + combo */
#growBar{min-width:150px}
#growBar .gt{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
#growBar small{font-size:11px;color:var(--muted);line-height:1}
#growBar .gb{width:120px;height:12px;border-radius:8px;background:var(--soft);overflow:hidden;position:relative}
#growBar .gb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#7dd8b2,#ffd166,#ff8fb1);border-radius:8px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
#growBar.full .gb i{animation:gfull .5s ease-in-out infinite alternate}
@keyframes gfull{to{filter:brightness(1.3)}}
.combo{position:absolute;transform:translate(-50%,-50%);font-weight:900;color:#fff;z-index:4700;pointer-events:none;white-space:nowrap;-webkit-text-stroke:0;text-shadow:0 3px 0 #7c6cf0,0 -2px 0 #7c6cf0,2px 0 0 #7c6cf0,-2px 0 0 #7c6cf0;animation:comboPop 1.3s ease-out forwards}
.combo.perfect{text-shadow:0 3px 0 #ff4f7b,0 -2px 0 #ff4f7b,2px 0 0 #ff4f7b,-2px 0 0 #ff4f7b}
@keyframes comboPop{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}20%{transform:translate(-50%,-60%) scale(1.25) rotate(3deg);opacity:1}40%{transform:translate(-50%,-60%) scale(1) rotate(0)}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
.lite .combo{animation-duration:.9s}
#mo.moWalk{transition:transform .95s ease-in-out}
#mo.moWalk svg{animation:moStep .24s ease-in-out infinite alternate}
@keyframes moStep{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-8px) rotate(2deg)}}
/* Mo嫂 */
#mo{width:170px;height:380px;cursor:pointer}
#mo svg{display:block;overflow:visible}
#mo .moThumb,#mo .moFrown{display:none}
#mo.good .moThumb{display:block}#mo.good .moArmR{display:none}
#mo.bad .moFrown{display:block}#mo.bad .moSmile{display:none}
.moHead{transform-box:view-box;transform-origin:85px 150px}
#mo.bad .moHead{animation:shake .2s ease-in-out 4}
#mo.good .moHead{animation:nod .3s ease-in-out 2}
@keyframes nod{50%{transform:translateY(6px)}}
.fan{transform-box:fill-box;transform-origin:50% 100%;animation:fan 1.4s ease-in-out infinite;animation-play-state:paused}
#mo.good .fan,#mo.bad .fan,#mo.tip .fan{animation-play-state:running}
@keyframes fan{50%{transform:rotate(-16deg)}}
.moBadge{position:absolute;transform:translate(-50%,-100%);background:#3b2a4a;color:#ffd166;border-radius:999px;padding:3px 12px;font-size:16px;font-weight:900;z-index:4400;pointer-events:none;white-space:nowrap}
.say.good{box-shadow:0 0 0 5px #3fbfad,0 8px 0 rgba(0,0,0,.12)}
.say.bad{box-shadow:0 0 0 5px #ff4f7b,0 8px 0 rgba(0,0,0,.12)}
.say.tip{box-shadow:0 0 0 5px #ffd166,0 8px 0 rgba(0,0,0,.12)}
.say.good:before,.say.bad:before,.say.tip:before{display:block;font-size:13px;font-weight:900;margin-bottom:2px}
.say.good:before{content:"👵 Mo嫂：✅ 做得啱";color:#2a9d8f}
.say.bad:before{content:"👵 Mo嫂：❌ 唔係咁喎";color:#e8335f}
.say.tip:before{content:"👵 Mo嫂提提你";color:#c78a00}
.say.good,.say.bad,.say.tip{white-space:normal;width:max-content;max-width:420px;font-size:19px;line-height:1.35}
/* bubbles & fx */
.say{position:absolute;background:#fff;border-radius:22px;padding:10px 16px;font-size:22px;font-weight:900;white-space:nowrap;box-shadow:0 6px 0 rgba(0,0,0,.12);transform:translate(-50%,-100%);z-index:4500;pointer-events:none;animation:pop .25s cubic-bezier(.3,1.5,.5,1)}
.say:after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes pop{from{transform:translate(-50%,-80%) scale(.6);opacity:0}to{transform:translate(-50%,-100%) scale(1);opacity:1}}
.fx{position:absolute;pointer-events:none;z-index:4600;transform:translate(-50%,-50%);animation:fxUp 1.6s ease-out forwards;font-size:34px;line-height:1;white-space:nowrap}
@keyframes fxUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-420%)}}
.fx.txt{font-size:26px;font-weight:900;color:#ff4f7b;text-shadow:0 3px 0 #fff,0 -3px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff}
.fx.bird{animation:bird 2.6s linear forwards;font-size:30px}
@keyframes bird{from{transform:translate(0,0) scaleX(-1)}to{transform:translate(200px,-40px) scaleX(-1)}}
.hand{position:absolute;font-size:56px;z-index:4800;pointer-events:none;animation:handMove 2.4s ease-in-out infinite}
@keyframes handMove{0%{transform:translate(0,0);opacity:0}15%{opacity:1}70%{transform:translate(var(--hx),var(--hy));opacity:1}100%{transform:translate(var(--hx),var(--hy));opacity:0}}
.coinb{position:absolute;background:#f5a623;color:#fff;border-radius:999px;padding:2px 8px;font-size:18px;font-weight:900;pointer-events:none;z-index:4400;transform:translate(-50%,-100%)}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;pointer-events:none;z-index:10}
.hb{pointer-events:auto;border:0;border-radius:20px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.14);font-weight:900;padding:9px 12px;font-size:16px;display:flex;align-items:center;gap:6px;white-space:nowrap;position:relative}
.hb:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.hb .dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#ff4f7b;border:2px solid #fff;display:none}
.hb .dot.show{display:block}
.hb.pulse{animation:hpulse .4s}
@keyframes hpulse{50%{transform:scale(1.15)}}
.hb small{font-size:11px;color:var(--muted);display:block;line-height:1.1}
.hb .col{display:flex;flex-direction:column;align-items:flex-start}
.sp{flex:1}
#chips{display:flex;gap:6px;pointer-events:auto}
.chip{border:0;border-radius:20px;background:rgba(255,255,255,.8);box-shadow:0 4px 0 rgba(0,0,0,.12);padding:5px 10px 5px 5px;display:flex;align-items:center;gap:6px;font-weight:900;font-size:13px}
.chip i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:18px}
.chip small{display:block;font-size:10px;color:var(--muted);line-height:1}
.chip.on{background:#fff;outline:3px solid var(--pink)}
.chip.add{padding:5px 12px;font-size:18px}
#tipbox{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 92px);max-width:min(560px,calc(100% - 24px));background:#fff;border-radius:20px;padding:10px 16px;font-weight:900;font-size:15px;box-shadow:0 5px 0 rgba(0,0,0,.12);z-index:9;pointer-events:none;transition:opacity .3s}
#tipbox:empty{opacity:0}
#evbar{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%);background:#2b2163;color:#fff;border-radius:20px;padding:10px 16px;font-weight:900;font-size:14px;z-index:11;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.25);display:none;max-width:94%;min-width:280px}
#evbar.show{display:block}
#evbar b{color:#ffd166;font-size:20px}
#evbar .st{display:flex;gap:10px;margin:6px 0;flex-wrap:wrap;font-size:13px}
#evbar .st span{opacity:.55}#evbar .st span.ok{opacity:1;color:#7dd8b2}
#rot{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 150px);text-align:center;font-size:13px;font-weight:800;color:#8a5a3a;z-index:8;pointer-events:none;display:none}
/* modal */
#modal{position:fixed;inset:0;background:rgba(43,33,99,.45);display:flex;align-items:center;justify-content:center;padding:14px;z-index:30}
#modal[hidden]{display:none}
.card{background:var(--card);border-radius:30px;padding:18px 16px;width:100%;max-width:460px;max-height:100%;overflow:auto;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.15);animation:cpop .3s cubic-bezier(.3,1.4,.5,1);touch-action:pan-y}
@keyframes cpop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:6px 0;font-size:23px}
.card h3{margin:14px 0 4px;font-size:16px;text-align:left}
.card p{line-height:1.6;font-size:14px;margin:6px 0}
.big{font-size:56px;line-height:1.15}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:13px;font-size:17px;font-weight:900;margin-top:10px;background:var(--pink);color:#fff;box-shadow:0 5px 0 #d6335d}
.btn.sec{background:var(--soft);color:var(--ink);box-shadow:0 5px 0 #d8c8e3}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d6335d}
.btn:disabled{opacity:.45}
.lbl{font-weight:900;text-align:left;margin:12px 0 6px}
.opts{display:flex;gap:8px}
.opt{flex:1;border:4px solid var(--soft);border-radius:18px;background:#fff;padding:8px 2px;font-weight:900;font-size:14px}
.opt span{display:block;font-size:30px;line-height:1.3}
.opt.on{border-color:var(--pink);background:#fff0f4}
input.nm{width:100%;border:4px solid var(--soft);border-radius:16px;padding:11px;font-size:18px;font-family:inherit;font-weight:900;text-align:center;color:var(--ink);outline:none}
input.nm:focus{border-color:var(--pink)}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 12px;margin-top:8px;text-align:left;box-shadow:0 4px 0 #f0e4f2}
.row .re{font-size:28px;width:38px;text-align:center;flex:none}
.row div{flex:1;font-size:14px;font-weight:800;min-width:0}
.row small{display:block;font-weight:700;color:var(--muted);font-size:12px}
.row button{border:0;border-radius:14px;padding:9px 12px;font-weight:900;background:var(--pink);color:#fff;box-shadow:0 4px 0 #d6335d;flex:none}
.row button.alt{background:var(--ok);box-shadow:0 4px 0 #2a9d8f}
.row button:disabled{background:#e8dff0;color:#a593b5;box-shadow:0 4px 0 #d8c8e3}
.row.done{background:#e8fbf0}
.pb{height:10px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:4px}
.pb i{display:block;height:100%;background:linear-gradient(90deg,#7dd8b2,#3fbfad);border-radius:9px}
.tabs{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.tabs button{flex:1;min-width:64px;border:0;border-radius:14px;padding:9px 4px;font-weight:900;background:var(--soft);font-size:13px}
.tabs button.on{background:var(--pink);color:#fff}
.note{background:#fff5d6;border-radius:14px;padding:10px 12px;font-size:13px;text-align:left;line-height:1.55;margin-top:8px}
.rules{background:#eef7ff;border-radius:16px;padding:12px;text-align:left;font-size:13px;line-height:1.6}
.rules li{margin:3px 0}
.licard{background:linear-gradient(135deg,#fff,#fff3d6);border:4px solid var(--ink);border-radius:18px;padding:14px;text-align:left;position:relative;margin:10px 0;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.licard .lt{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:2px}
.licard .lc{font-size:22px;font-weight:900;margin:4px 0}
.licard .ph{position:absolute;right:14px;top:14px;width:70px;height:84px;border-radius:10px;background:#ffe3c2;display:grid;place-items:center;font-size:30px;border:3px solid var(--ink)}
.licard p{margin:2px 0;font-size:13px}
.stamp{position:absolute;right:20px;bottom:10px;font-size:20px;font-weight:900;color:var(--pink);border:3px solid var(--pink);border-radius:10px;padding:2px 8px;transform:rotate(-12deg)}
.small{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.shopi{border:0;background:#fff;border-radius:18px;padding:10px 6px;font-weight:900;font-size:13px;box-shadow:0 4px 0 #f0e4f2;text-align:center;position:relative}
.shopi .pv{height:70px;display:grid;place-items:center;font-size:42px}
.shopi .pv svg{max-height:70px;max-width:100%}
.shopi .br{display:block;font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.shopi small{display:block;color:#d08a00;margin-top:2px}
.shopi.own small{color:var(--ok)}
.shopi .tag{position:absolute;top:6px;left:6px;background:var(--pink);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}
.mallhd{background:linear-gradient(135deg,#ffd6e0,#d9f0ff);border-radius:20px;padding:12px;text-align:left}
.mallhd b{font-size:20px}
.brandbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.brandbar span{background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:900}
.detail{background:#fff;border-radius:22px;padding:14px;margin-top:8px}
.detail .pv{height:150px;display:grid;place-items:center;font-size:90px}
.detail .pv svg{max-height:150px}
.stat{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border-radius:14px;overflow:hidden;margin-top:8px}
.stat th,.stat td{padding:6px 5px;text-align:right;border-bottom:1px solid #f0e4f2;font-variant-numeric:tabular-nums}
.stat th:first-child,.stat td:first-child{text-align:left}
.stat th{background:#fbf3ff;font-size:11px}
.tl{display:flex;gap:4px;margin:8px 0;flex-wrap:wrap;justify-content:center}
.tl span{font-size:11px;font-weight:900;border-radius:999px;padding:3px 8px;background:var(--soft);color:var(--muted)}
.tl span.done{background:#d8f5e6;color:#2a9d8f}.tl span.cur{background:var(--pink);color:#fff}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translate(-50%,-10px);background:var(--ink);color:#fff;font-weight:900;font-size:15px;padding:10px 16px;border-radius:18px;z-index:40;opacity:0;transition:.25s;pointer-events:none;text-align:center;max-width:90%}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>

 pop(){tone(600,.08,'sine',.08,500);},pick(){tone(420,.06,'triangle',.06,200);},drop(){tone(220,.09,'sine',.08,-80);},

 squeak(){tone(1200,.12,'square',.04,500);tone(1500,.1,'square',.04,-400,.13);},roar(){tone(160,.5,'sawtooth',.07,-60);},
 fill(){for(let i=0;i<6;i++)tone(500+i*60,.08,'sine',.04,0,i*.1);},gulp(){tone(300,.12,'sine',.08,-150);tone(200,.15,'sine',.07,-80,.12);},

/* =================== 舞台 =================== */
let scale=1,offX=0,offY=0;
function clampX(x){const aw=innerWidth-(R.dockW||0),w=SW*scale;if(w<=aw)return (aw-w)/2;return clamp(x,aw-w,0);}
function layout(){
 const vw=innerWidth,vh=innerHeight;
 const side=vh<520&&vw>vh;document.body.classList.toggle('sidedock',side);
 const dockH=side?0:86;R.dockW=side?86:0;
 const aw=vw-R.dockW,ah=vh-dockH;
 scale=side?ah/SH:Math.min(ah/SH,aw/700);
 offY=Math.max(0,(ah-SH*scale)/2);
 if(ah>SH*scale+10)offY=Math.min(offY,Math.max(110,(ah-SH*scale)*.5));
 offX=clampX(offX);
 $('rot').style.display=vh>vw*1.15?'block':'none';
 applyStage();
}
function applyStage(){stage.style.transform=`translate3d(${offX}px,${offY}px,0) scale(${scale})`;if($('panL'))renderPanBtns();}
function focusX(x,smooth){const vw=innerWidth;offX=clampX((vw-(R.dockW||0))/2-x*scale);if(smooth){stage.classList.add('cam');clearTimeout(R.camT);R.camT=setTimeout(()=>stage.classList.remove('cam'),500);}else{clearTimeout(R.camT);stage.classList.remove('cam');}applyStage();}
function panBy(dx){const vw=innerWidth;offX=clampX(offX+dx);stage.classList.add('cam');clearTimeout(R.camT);R.camT=setTimeout(()=>stage.classList.remove('cam'),500);applyStage();}
function renderPanBtns(){const aw=innerWidth-(R.dockW||0),min=Math.min(0,aw-SW*scale);$('panL').classList.toggle('show',offX<-4&&SW*scale>aw);$('panR').classList.toggle('show',offX>min+4&&SW*scale>aw);}
function toStage(e){return {x:(e.clientX-offX)/scale,y:(e.clientY-offY)/scale};}
addEventListener('resize',layout);

let drag=null,pan=null;
function onDown(e,id){
 if(EV&&EV.over)return;
 if(id==='pa'||id==='bb'){const under=document.elementsFromPoint(e.clientX,e.clientY).find(el=>el.classList&&el.classList.contains('item')&&E[el.id]&&E[el.id].kind==='item');if(under&&id==='pa')id=under.id;}
 if(id==='mo'){const under=document.elementsFromPoint(e.clientX,e.clientY).find(el=>el.classList&&el.classList.contains('item')&&E[el.id]&&E[el.id].kind==='item');if(under)id=under.id;else{e.preventDefault();e.stopPropagation();tapMo();return;}}
 e.preventDefault();e.stopPropagation();au();
 const p=toStage(e);
 const ent=id==='bb'?{kind:'bb'}:id==='pa'?{kind:'pa'}:id==='strB'?{kind:'str'}:E[id];
 if(!ent||ent.kind==='parcel')return;
 if(ent.kind==='str'){tapStroller();return;}
 if(ent.kind==='item'&&ent.it.busy)return;
 if(ent.kind==='bb'&&R.busy)return;
 const obj=ent.kind==='bb'?B():ent.kind==='pa'?{x:S.pa.x,y:792}:ent.it;
 drag={id,ent,pid:e.pointerId,sx:e.clientX,sy:e.clientY,ox:obj.x-p.x,oy:obj.y-p.y,moved:false,el:$(id)};
 try{$(id).setPointerCapture(e.pointerId);}catch(_){}
}
function zoneHints(kind,it){
 clearZoneHints();const Zs=[];const bbR=()=>{const r=bbRect();return {x:r.x,y:r.y,w:r.w,h:r.h,l:'畀BB',c:'bb'};};
 if(kind==='bb'){Zs.push({...Z.crib,l:'BB床'});if(B().stage>=2)Zs.push({...Z.tub,l:'浴盆'});if(B().stage>=7)Zs.push({...Z.chair,l:'BB櫈'});Zs.push({...paRect(),l:'抱抱',c:'bb'});if(strollerActive())Zs.push({...strZone(),l:'嬰兒車'});}
 else if(it){const t=it.t;
  if(t==='bottle'){if(it.lv<=0)Zs.push({...Z.mach,l:'斟奶'});else Zs.push(bbR());}
  else if(t==='dirty'||(t==='jar'&&!it.full))Zs.push({...Z.bin,l:'垃圾桶'});
  else if(t==='diaper'){if(B().dia)Zs.push(bbR());}
  else if(t==='sponge'||t==='jar')Zs.push(bbR());
  else if(IT[t]&&IT[t].toy){Zs.push(bbR());Zs.push({...Z.box,l:'收埋'});}
  if(EV&&EV.bag&&BAG_ITEMS.includes(t))Zs.push({...bagZone(),l:'媽咪袋'});}
 for(const z of Zs){const d=document.createElement('div');d.className='zh '+(z.c||'');d.style.cssText=`left:${z.x}px;top:${z.y}px;width:${z.w}px;height:${z.h}px`;d.innerHTML=`<b>${z.l}</b>`;stage.appendChild(d);}
}
function clearZoneHints(){document.querySelectorAll('.zh').forEach(e=>e.remove());}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(_){}}
function startLift(){
 const d=drag;d.moved=true;d.el.classList.remove('fall','glide','walk');d.el.classList.add('lift');SND.pick();
 if(d.ent.kind==='bb'){const b=B();if(b.asleep)wake(true);if(b.loc==='held')$('pa').classList.remove('holding');b.loc='lift';setFace('wide','o');evMark('bb');}
 if(d.ent.kind==='item'){evMark(d.ent.it.t,d.ent.it);}
 zoneHints(d.ent.kind,d.ent.it);buzz(12);
 hideHint();
}
addEventListener('pointermove',e=>{
 if(pan&&e.pointerId===pan.pid){offX=clampX(pan.ox+(e.clientX-pan.sx));applyStage();return;}
 if(!drag||e.pointerId!==drag.pid)return;
 if(!drag.moved){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<8)return;startLift();}
 drag.lx=e.clientX;
 const p=toStage(e),k=drag.ent.kind;
 if(k==='pa'){S.pa.x=clamp(p.x+drag.ox,90,1510);drawPA();if(B().loc==='held')drawBB();return;}
 const x=clamp(p.x+drag.ox,30,1570),y=clamp(p.y+drag.oy,60,795);
 if(k==='bb'){B().x=x;B().y=y;placeEl(drag.el,x,y,150,170,6000);}
 else{const it=drag.ent.it;it.x=x;it.y=y;placeEl(drag.el,x,y,72,72,6000);hoverHint(p);}
});
function endDrag(e){
 if(pan&&e.pointerId===pan.pid){pan=null;return;}
 if(!drag||e.pointerId!==drag.pid)return;
 const d=drag;drag=null;d.el.classList.remove('lift');clearZoneHints();
 const k=d.ent.kind;
 if(!d.moved){if(k==='bb')tapBB();else if(k==='pa')tapPA();else tapItem(d.ent.it);return;}
 const p=toStage(e);SND.drop();
 buzz(8);
 if(k==='bb'){dropBB(p);setTimeout(()=>{const sx=B().x*scale+offX;if(sx<innerWidth*.15||sx>innerWidth*.85)focusX(B().x,true);},700);}else if(k==='pa'){drawPA();save();}else dropItem(d.ent.it,p);
 clearHover();
}
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
vp.addEventListener('pointerdown',e=>{if(drag)return;au();pan={pid:e.pointerId,sx:e.clientX,ox:offX};});
function autoPan(){if(drag&&drag.moved&&drag.lx!=null){const vw=innerWidth;if(drag.lx<60)offX+=10;else if(drag.lx>vw-60)offX-=10;offX=clampX(offX);applyStage();}}
const inR=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
const Z={crib:{x:745,y:370,w:255,h:235},tub:{x:1100,y:430,w:200,h:175},chair:{x:1318,y:360,w:130,h:150},bin:{x:240,y:480,w:110,h:130},mach:{x:500,y:345,w:110,h:105},box:{x:1450,y:470,w:140,h:135}};
const strZone=()=>({x:S.strollerX-105,y:600,w:210,h:200});
const bagZone=()=>({x:150,y:680,w:130,h:120});
const onRug=p=>p.y>640&&((p.x-820)/320)**2+((p.y-718)/70)**2<=1;
const SURF=[{a:30,b:230,y:252},{a:262,b:478,y:322},{a:14,b:246,y:428},{a:494,b:706,y:440},{a:762,b:980,y:548},{a:1130,b:1270,y:522},{a:1320,b:1446,y:448}];
function restY(p){if(p.y>=600)return clamp(p.y,630,792);let best=null;for(const s of SURF)if(p.x>=s.a&&p.x<=s.b&&s.y>=p.y-30&&(!best||s.y<best.y))best=s;return best?best.y:clamp(700+rand(-30,40),630,792);}

function settle(it,p,opt){
 const e=E[it.id];if(!e)return;const el=e.el;el.classList.add('fall');
 it.x=clamp(p.x,30,1570);
 if(IT[it.t].float&&!(opt&&opt.y!=null))it.y=110+rand(-10,20);else it.y=opt&&opt.y!=null?opt.y:restY(p);

function nearBB(){const b=B(),l=b.loc;if(l==='crib')return {x:rand(790,950),y:548};if(l==='tub')return {x:rand(1150,1250),y:522};if(l==='chair')return {x:rand(1345,1425),y:448};if(l==='held')return {x:clamp(S.pa.x+rand(-120,120),40,1560),y:rand(740,790)};if(l==='stroller')return {x:clamp(S.strollerX+rand(-160,-110),40,1560),y:rand(740,790)};return {x:clamp(b.x+rand(-110,110),40,1560),y:clamp(b.y+rand(-10,30),640,792)};}

const R={busy:false,taps:[],cryStart:0,lastSob:0,cd:{},sleepSec:0,yawn:0,mobileUntil:0,lastAct:0,diaperAt:0,preview:null};
const cd=(k,ms)=>{if(now()-(R.cd[k]||0)<ms)return false;R.cd[k]=now();return true;};
function minNeed(){const n=B().needs;let k=null,v=999;for(const x in n)if(n[x]<v){v=n[x];k=x;}return {k,v};}
const evOn=()=>!!(EV&&EV.started&&!EV.over);
function isCrying(){return evOn()||(!B().asleep&&minNeed().v<20);}
function isCryingOther(){const b=B(),n=b.needs;return n.hunger<20||!!b.dia;}
function idleFace(){
 if(R.busy)return;const b=B(),el=bbEl();
 el.classList.toggle('poop',b.dia==='poop');
 el.querySelector('.smudge').setAttribute('opacity',b.smudge?1:0);
 if(b.asleep){el.classList.remove('cry');return setFace('closed','suck');}
 if(isCrying()){el.classList.add('cry');return setFace('cry','wail');}
 el.classList.remove('cry');
 if(minNeed().v<40)setFace('open','flat');else setFace('open',b.stage>=4?'smile':'flat');

function placeBB(loc,p){
 const b=B(),el=bbEl();b.loc=loc;el.classList.add('glide');
 if(loc==='crib'){b.x=870;b.y=570;}else if(loc==='tub'){b.x=1200;b.y=585;}else if(loc==='chair'){b.x=1384;b.y=484;}
 else if(loc==='held')$('pa').classList.add('holding');else if(loc==='stroller'){}
 else{b.x=clamp(p.x,90,1510);b.y=clamp(p.y,640,792);b.loc='floor';}

function dropBB(p){
 const b=B();
 if(moPresent()&&inR(p,moRect())){placeBB('floor',{x:MOX-160,y:770});moSay('自己個BB自己抱啦 😏 我睇住你','tip');return setTimeout(idleFace,700);}
 if(strollerActive()&&inR(p,strZone())){placeBB('stroller');onStroller();}
 else if(inR(p,paRect())){placeBB('held');onHeld();}
 else if(inR(p,Z.crib)){placeBB('crib');onCrib();}
 else if(inR(p,Z.tub)){if(b.stage<2){placeBB('floor',{x:1200,y:760});bbSay('臍帶未甩，暫時用海綿抹身 🧽',2200);SND.bad();moJudge(false,'臍帶未甩唔好浸水！用海綿抹身，臍帶位保持乾爽','cord');}else{placeBB('tub');onTub();}}
 else if(inR(p,Z.chair)){if(b.stage<7){placeBB('floor',{x:1380,y:770});bbSay('BB未識坐，6個月先坐BB櫈 🪑',2200);SND.bad();}else{placeBB('chair');setFace('happy','grin');bbSay('坐BB櫈！準備開餐 🥄');SND.giggle();}}
 else if(inR(p,Z.box)){placeBB('floor',{x:1420,y:760});bbSay('BB唔係玩具嚟㗎 😂');paSay('唔好將BB收埋呀！');SND.giggle();moJudge(false,'你搞乜鬼呀！BB唔可以放入玩具箱 😱','silly');}
 else if(inR(p,Z.bin)){placeBB('floor',{x:380,y:760});paSay('喂！！BB唔可以掉 😱');SND.bad();moJudge(false,'嘩！你想嚇死我咩 😱','silly');}
 else if(b.stage>=6&&onRug(p)){placeBB('floor',{x:clamp(p.x,560,1080),y:clamp(p.y,680,760)});tummy();}
 else{placeBB('floor',p);setFace(b.stage>=4?'happy':'open','smile');}
 setTimeout(idleFace,700);
}

 if(S.parent==='mum'&&b.feed==='breast'&&b.needs.hunger<=85&&!R.busy)return breastfeed();
 setFace('happy',b.stage>=4?'grin':'smile');bbCls('bounce',1300);burst('💗',4,S.pa.x,520);SND.giggle();

function fallAsleep(){const b=B();if(b.asleep||!['crib','stroller'].includes(b.loc))return;b.asleep=true;R.sleepSec=0;idleFace();SND.pop();reward(3,2,b.x,b.y-170);track('sleep');if(b.loc==='crib'){track('cribSleep');pUse(S.crib);if(cribItems().length){moJudge(false,'BB瞓覺，床上唔好放公仔同雜物（安全睡眠）','safe');R.cribCheck=now();}else if(moPresent())moJudge(true,'仰瞓、床上冇雜物，好安全 ✅','safe');}fx('💤',b.x+50,b.y-160);save();}

function strollerActive(){return !!(S.stroller||(S.trial&&S.trial.until>now()));}
function strollerId(){return S.stroller||(S.trial&&S.trial.until>now()?S.trial.id:null);}
function renderStroller(){
 const id=strollerId();
 if(!id){['strB','strF'].forEach(x=>$(x)&&$(x).remove());return;}
 const c=STROLLERS[id].c;
 if(!$('strB')){mkEnt('strB','',strollerSVG(c,'back'),210,190);const f=document.createElement('div');f.id='strF';f.className='over';stage.appendChild(f);}
 if($('strB').dataset.id!==id){$('strB').innerHTML=strollerSVG(c,'back');$('strF').innerHTML=strollerSVG(c,'front');$('strB').dataset.id=id;}
 placeEl($('strB'),S.strollerX,795,210,190,1790);placeEl($('strF'),S.strollerX,795,210,190,1805);
}
function onStroller(){const b=B();setFace('happy','smile');bbSay('坐車車 🚼 㩒架車推我散步！',2000);if(b.asleep)wake();}
let pushing=false;

 const b=B();au();
 if(pushing)return;
 if(b.loc!=='stroller'){paSay('將BB放入嬰兒車先推得 🚼',1600);SND.pop();return;}
 pushing=true;R.busy=true;const x0=S.strollerX,x1=clamp(x0-340,300,1400);

 bbSay('散步囉～ 🌳',1800);SND.giggle();

 setTimeout(()=>go(x1),30);setTimeout(()=>go(x0),2000);

  b.needs.fun=Math.min(100,b.needs.fun+20);if(cd('stroll',3000)){reward(4,2,b.x,b.y-170);track('stroll');pUse(strollerId());}
  if(b.needs.sleep<55&&!isCryingOther()){bbSay('推推下… 眼瞓瞓 😪',1500);R.yawn=now()+1200;}else{setFace('happy','grin');bbSay('好好玩！再推！',1500);}

/* =================== 物品 =================== */
function dropItem(it,p){
 if(EV&&EV.bag&&inR(p,bagZone()))return toBag(it);
 if(moPresent()&&inR(p,moRect())){moSay(pick(['畀我做乜？你自己嚟！我喺度睇住你 😌','我淨係教，唔代勞㗎 😏']),'tip');return settle(it,{x:MOX-150,y:775});}
 if(inR(p,bbRect())&&B().loc!=='lift')return useOnBB(it);
 if(inR(p,Z.bin))return toBin(it);
 if(inR(p,Z.mach)&&it.t==='bottle')return refill(it);
 if(inR(p,Z.box))return toBox(it);
 if(inR(p,paRect())&&IT[it.t].toy){paSay(pick(['我唔玩㗎，畀BB啦 😅','多謝… 但我淨係想瞓覺']));return settle(it,{x:S.pa.x+rand(-60,60),y:780});}
 settle(it,p);
}
function attachToBB(it,dx,dy){it.busy=true;it.held=true;const e=E[it.id];e.el.classList.add('glide');it.x=B().x+dx;it.y=B().y+dy;drawItem(it);}
function releaseFromBB(it,throwFar){it.busy=false;it.held=false;const e=E[it.id];if(!e)return;e.el.classList.remove('glide');const nb=throwFar?{x:clamp(B().x+rand(-380,380),60,1540),y:rand(650,780)}:nearBB();settle(it,nb,IT[it.t].float?null:{y:nb.y});}
function refuseItem(it,text){bbCls('shake',1100);setFace('open','flat');bbSay(text,1600);SND.bad();const nb=nearBB();settle(it,nb,{y:nb.y});setTimeout(idleFace,1200);}
function useOnBB(it){
 const b=B(),n=b.needs;
 if(R.busy)return settle(it,nearBB());

 for(const it of S.items)if(it.t==='dirty'){it.t0=it.t0||now();if(!it.moW&&now()-it.t0>40000&&!evOn()){it.moW=1;moJudge(false,'臭尿片唔好留喺地下，掉落垃圾桶！','dirty');}}
 if(R.cribCheck&&b.asleep&&b.loc==='crib'&&!cribItems().length){R.cribCheck=0;moJudge(true,'執走晒，安全睡眠 ✅','safefix');}

function tipText(){
 if(evOn())return '考牌試進行中：睇上面線索，搵出BB要咩！';

 if(!S.seenHint&&!S.cnt.feed)return b.feed==='breast'&&S.parent==='mum'?'👆 BB肚餓時，拖BB去媽媽身上親餵（或者用奶樽）':'👆 將奶樽拖去BB度餵奶';

 if(b.dia)return `${b.dia==='poop'?'💩 屙咗':'💧 濕咗'}！喺換片枱攞尿片，拖落BB度`;
 if(S.items.some(i=>i.t==='dirty'))return '🗑️ 將臭尿片拖落垃圾桶';

 if(n.hunger<35){const bt=S.items.find(i=>i.t==='bottle');if(S.parent==='mum'&&b.feed==='breast')return '🍼 肚餓：拖BB去媽媽身上親餵';return bt&&bt.lv<=0?'🍼 奶樽空咗，拖落沖奶機':'🍼 肚餓：拖奶樽去BB度';}
 if(n.sleep<30)return '😪 眼瞓：抱入BB床，熄燈或者㩒床鈴會快啲瞓';
 if(n.clean<35||b.smudge)return b.stage<2?'🧽 拖海綿去BB度抹身':'🛁 抱BB落浴盆沖涼';
 if(Math.floor(S.piggy)>=20)return `🐷 錢罌儲咗 ${Math.floor(S.piggy)} 🪙，㩒佢收錢`;

 return '';

 if(p.id.startsWith('rug_')){const c=RUGS[p.id.slice(4)].c;return `<svg viewBox="0 0 100 50" width="${big?170:95}" height="${big?85:48}"><ellipse cx="50" cy="25" rx="48" ry="22" fill="${c[0]}"/><ellipse cx="50" cy="25" rx="34" ry="14" fill="${c[1]}"/></svg>`;}

function owns(p){if(p.cat==='stroller')return !!S.strollers[p.id];if(p.cat==='outfit')return !!S.wardrobe[p.id];if(p.cat==='crib')return !!S.cribs[p.id];if(p.id.startsWith('wall_'))return !!S.walls[p.id.slice(5)];if(p.id.startsWith('rug_'))return !!S.rugs[p.id.slice(4)];if(p.id.startsWith('deco_'))return !!S.deco[p.id.slice(5)];return !!S.owned[p.id];}

  for(const {p,s} of rows)h+=`<tr><td>${PNAME(p)}</td><td>${BRANDS[p.brand].n}</td><td>${s.v}</td><td>${s.t}</td><td>${s.b}</td><td>${s.u}</td></tr>`;

 }
 h+=`<p class="small">所有品牌同商品均為遊戲虛構，唔代表真實產品，亦唔係育兒用品安全建議。商場只賣外觀同玩具，唔會令BB更健康或者成長更快。</p>`;

   save();renderHUD();reopen(()=>openMall('brand'));});

function openProduct(id){
 const p=PRODUCTS.find(x=>x.id===id);pStat(id,'v');track('mallView');save();
 const o=owns(p),canTry=['stroller','outfit','crib','home'].includes(p.cat);
 const h=`<div class="detail"><span class="small">${BRANDS[p.brand].n}・${BRANDS[p.brand].d}</span><div class="pv">${pPreview(p,true)}</div><h2>${PNAME(p)}</h2><p>${p.desc}</p><p><b>${o?'✅ 已擁有':p.price+' 🪙'}</b>　<span class="small">你有 ${S.coins} 🪙</span></p></div>`;
 const btns=[];
 if(o)btns.push({t:p.cat==='outfit'?'著上身 👕':p.cat==='toy'?'再買多件（'+p.price+'🪙）':'使用',f:()=>{if(p.cat==='toy')return buy(p);equip(p);setTimeout(()=>openMall(p.cat),30);}});
 else btns.push({t:`購買 ${p.price} 🪙`,dis:S.coins<p.price,f:()=>{buy(p);}});
 if(canTry&&!o)btns.push({t:p.cat==='stroller'?'免費試用 3 分鐘 🚼':p.cat==='outfit'?'試身 👀':'預覽 15 秒 👀',cls:'sec',f:()=>{tryOn(p);}});
 btns.push({t:'返回商場',cls:'sec',f:()=>{setTimeout(()=>openMall(p.cat),30);}});
 modal(h,btns);
}
function buy(p){
 if(S.coins<p.price){toast('金幣唔夠，做任務或者收錢罌儲吓先');return false;}
 S.coins-=p.price;pStat(p.id,'b');SND.win();
 if(p.cat==='toy'){S.owned[p.id]=1;let px=clamp(B().x+170,100,1500);if(Math.abs(px-660)<100)px+=140;const pc={t:p.id,x:px,y:775};S.parcels.push(pc);spawnParcel(pc);toast(`📦 ${PNAME(p)}送到喇！喺地下㩒個包裹拆開`);focusX(px);}
 else{if(p.cat==='stroller')S.strollers[p.id]=1;if(p.cat==='outfit')S.wardrobe[p.id]=1;if(p.cat==='crib')S.cribs[p.id]=1;if(p.id.startsWith('wall_'))S.walls[p.id.slice(5)]=1;if(p.id.startsWith('rug_'))S.rugs[p.id.slice(4)]=1;if(p.id.startsWith('deco_'))S.deco[p.id.slice(5)]=1;equip(p);toast(`🛍️ 買咗 ${PNAME(p)}！`);setTimeout(()=>openMall(p.cat),40);}
 checkAch();save();renderHUD();
}
function equip(p){
 if(p.cat==='stroller'){S.stroller=p.id;S.trial=null;}
 if(p.cat==='outfit'){B().outfit=p.id;applyLook(B());bbSay('新衫！靚唔靚？✨',1600);}
 if(p.cat==='crib')S.crib=p.id;
 if(p.id.startsWith('wall_'))S.wall=p.id.slice(5);if(p.id.startsWith('rug_'))S.rug=p.id.slice(4);
 if(p.id.startsWith('deco_')){const k=p.id.slice(5);S.decoOn[k]=!S.decoOn[k]||true;}
 pUse(p.id);renderRoom();save();
}
function tryOn(p){
 pStat(p.id,'t');
 if(p.cat==='stroller'){S.trial={id:p.id,until:now()+180000};renderRoom();focusX(S.strollerX);toast(`🚼 ${PNAME(p)} 試用 3 分鐘！將BB放入車再㩒架車推`);save();return;}
 if(p.cat==='outfit'){track('tryOutfit');R.preview={kind:'outfit',id:p.id};applyLook(B(),p.id);focusX(B().x);bbSay('試身中… 好襯呀！👀',1800);setTimeout(()=>{if(R.preview&&R.preview.id===p.id){R.preview=null;applyLook(B());}},12000);toast('試身 12 秒，鍾意就去購買');save();return;}
 const keep={crib:S.crib,wall:S.wall,rug:S.rug,decoOn:{...S.decoOn}};
 if(p.cat==='crib')S.crib=p.id;if(p.id.startsWith('wall_'))S.wall=p.id.slice(5);if(p.id.startsWith('rug_'))S.rug=p.id.slice(4);if(p.id.startsWith('deco_'))S.decoOn[p.id.slice(5)]=true;
 renderRoom();toast('預覽 15 秒 👀');R.preview={kind:'home',id:p.id};
 setTimeout(()=>{if(R.preview&&R.preview.id===p.id){Object.assign(S,{crib:keep.crib,wall:keep.wall,rug:keep.rug,decoOn:keep.decoOn});R.preview=null;renderRoom();}},15000);
}

function metrics(){
 const ss=S.m.sess,days=Object.keys(S.m.days).sort();const dur=ss.map(s=>(s.e-s.s)/60000).filter(x=>x>=0);
 const avg=dur.length?dur.reduce((a,b)=>a+b,0)/dur.length:0;const first=dk(S.m.first),d1=dk(S.m.first+86400000);
 return {first,days:days.length,sess:ss.length,avg:avg.toFixed(1),total:dur.reduce((a,b)=>a+b,0).toFixed(0),d1:S.m.days[d1]?'有 ✅':(dk()<=first?'未到第2日':'冇'),streak:S.streak.n,babies:S.babies.map(b=>b.name+'('+STAGES[b.stage].age+')').join('、'),lic:S.lic.passed.length,coins:S.coins};
}

  {t:'返回'}]);

$('hCoins').onclick=()=>{au();openMall();};$('hHearts').onclick=()=>{au();toast(`❤️ 愛心：${S.hearts}（照顧BB累積嘅感情）`);};
$('growBar').onclick=()=>{au();openGrow();};$('bLic').onclick=()=>{au();if(!evOn())openLicense();};$('bGrow').onclick=()=>{au();openGrow();};$('bTask').onclick=()=>{au();openTasks();};$('bMall').onclick=()=>{au();if(!evOn())openMall();};$('bSet').onclick=()=>{au();openSettings();};
['hud','evbar','modal','dock','panL','panR'].forEach(id=>$(id).addEventListener('pointerdown',e=>e.stopPropagation()));

/* =================== 新手提示 =================== */
function showHint(){if(S.seenHint||S.cnt.feed)return;const bt=S.items.find(i=>i.t==='bottle');if(!bt)return;const h=document.createElement('div');h.className='hand';h.textContent='👆';h.id='hand';h.style.left=(bt.x-10)+'px';h.style.top=(bt.y-30)+'px';h.style.setProperty('--hx',(B().x-bt.x)+'px');h.style.setProperty('--hy',(B().y-100-bt.y)+'px');stage.appendChild(h);}
function hideHint(){if($('hand')){$('hand').remove();S.seenHint=true;}}

/* =================== 開始 =================== */
function buildWorld(){
 mkEnt('bb','',bbSVG(),150,170);mkEnt('pa','',paSVG(S.parent==='mum'),170,400);
 drawPA();const b=B();if(b.loc==='lift')b.loc='floor';if(b.loc==='held')$('pa').classList.add('holding');if(b.loc==='stroller'&&!strollerActive())b.loc='floor';
 applyLook(b);drawBB();
 for(const it of S.items){it.busy=false;it.held=false;it.inBag=false;spawnItem(it);}
 for(const p of S.parcels)spawnParcel(p);
 renderRoom();renderGift();renderHUD();renderChips();updateClock();setFace('open','smile');idleFace();focusX(b.x);
}
function babyModal(first){
 const st={parent:'mum',gender:'none',feed:'breast'};
 modal(`<div class="big">${first?'👶🚗':'👶➕'}</div><h2>${first?'生仔要考牌':'屋企多咗位BB！'}</h2><p class="small">${first?'Parenthood Challenge':`最多 3 個BB，每個由出世第一日開始`}</p>
  ${first?`<p class="lbl">你係：</p><div class="opts" data-g="parent"><button class="opt on" data-v="mum"><span>👩</span>媽媽</button><button class="opt" data-v="dad"><span>👨</span>爸爸</button></div>`:''}
  <p class="lbl">BB係：</p><div class="opts" data-g="gender"><button class="opt" data-v="boy"><span>👦</span>BB仔</button><button class="opt" data-v="girl"><span>👧</span>BB女</button><button class="opt on" data-v="none"><span>🎁</span>出世先知</button></div>
  <p class="lbl">第一餐食咩？</p><div class="opts" data-g="feed"><button class="opt on" data-v="breast"><span>🤱</span>人奶</button><button class="opt" data-v="formula"><span>🍼</span>奶粉</button></div>
  <p class="small" style="text-align:left">兩種都可以餵大BB，按媽媽身體同家庭情況決定。揀人奶而你係媽媽，可以將BB拖去自己身上親餵。</p>
  <p class="lbl">BB叫咩名？</p><input class="nm" id="nm" maxlength="8" placeholder="例如：豆豆">`,
  [{t:'BB出世喇！▶',f:()=>{
    const nm=($('nm').value||'').trim().slice(0,8)||pick(['豆豆','啤啤','糖糖','仔仔','妹妹','波波']);
    if(first){S=newSave({...st,name:nm});newDay();S.m.sess.push({s:now(),e:now()});S.m.days[dk()]=1;save();buildWorld();}
    else{S.babies.push(newBaby({...st,name:nm}));checkAch();switchBB(S.babies.length-1);}
    const b=B();
    setTimeout(()=>modal(`<div class="big">${b.random?'🎁':'🚨'}</div><h2>${b.random?`揭曉！原來係${b.gender==='girl'?'BB女 👧':'BB仔 👦'}！`:'恭喜你！BB出世啦！'}</h2><div style="display:flex;justify-content:center">${miniBB(b.outfit,b.gender)}</div><p>${first?'歡迎參加《生仔要考牌》！<br>你以為湊BB只係餵奶、換片、氹瞓覺？<br><b>真正嘅挑戰，依家先開始！</b>':`${b.name}加入咗屋企！`}</p><div class="note">📈 今日係 <b>${b.name}出世第1日</b>：新生BB大約每 2 至 3 個鐘要食一次奶。完成照顧目標，BB就會慢慢長大（識笑、抓嘢、翻身…）。</div><div class="note">👵 <b>Mo嫂</b>會喺隔籬陪月到滿月：做得啱唔啱佢會即刻話你知，唔識就㩒佢問。</div><p class="small">房入面所有嘢都可以拖、可以㩒。</p>`,[{t:`開始照顧${b.name} 💪`,f:()=>{if(first)setTimeout(showHint,400);}}]),100);
   }}],
  c=>{c.querySelectorAll('.opts').forEach(g=>g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st[g.dataset.g]=b.dataset.v;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));SND.pop();}));});
}
function welcomeBack(){
 const gap=(now()-S.lastSeen)/60000,el=Math.min(gap,24*60),b=B();
 b.needs.hunger=Math.max(20,b.needs.hunger-Math.min(45,el*3));b.needs.sleep=Math.max(25,b.needs.sleep-Math.min(40,el*2));b.needs.fun=Math.max(25,b.needs.fun-Math.min(40,el*2));
 S.piggy=Math.min(60,S.piggy+el/2);if(b.asleep&&gap>2)b.asleep=false;
 if(gap>=20){
  const lines=[`${b.name}自己同熊仔講咗好耐嘢 🧸`,`${b.name}望住窗外啲雀仔好耐 🐦`,`${b.name}喺夢入面笑咗 😴`,`${b.name}一直望住門口等你 🥺`,`嫲嫲幫手湊咗陣，話${b.name}好乖 👵`];
  const h=gap>=60?Math.floor(gap/60)+' 個鐘':Math.floor(gap)+' 分鐘';
  setTimeout(()=>modal(`<div class="big">👶💕</div><h2>你返嚟喇！</h2><p>你走咗 ${h}，</p><p>${pick(lines)}</p><p>🐷 錢罌儲咗 <b>${Math.floor(S.piggy)}</b> 🪙，記得㩒佢收！${giftReady()?'<br>🎁 今日禮物喺地下等你拆！':''}</p>`,[{t:`去睇${b.name} 💗`}]),400);
 }
}
load();layout();
if(S&&S.v===3){S.m.sess.push({s:now(),e:now()});welcomeBack();newDay();buildWorld();}else{S=null;babyModal(true);}
buildHotspots();
$('panL').onclick=()=>{au();panBy(innerWidth*.6);};$('panR').onclick=()=>{au();panBy(-innerWidth*.6);};
renderPanBtns();if(S)renderMeters();fpsProbe();
setTimeout(()=>{$('splash').classList.add('out');setTimeout(()=>$('splash').remove(),600);},600);
setInterval(tick,1000);
(function raf(){if(drag)autoPan();requestAnimationFrame(raf);})();
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveNow();stopMusic();}else if(S&&S.radio)playMusic('radio');});
addEventListener('pagehide',saveNow);document.addEventListener('gesturestart',e=>e.preventDefault());
window.__g={focusX,moJudge,devComplete(){const b=B();const gs=stageGoals(b);gs.forEach((g,i)=>b.prog[g.k]=i?g.n:g.n-1);track(gs[0].k);},stageGoals,get S(){return S;},R,get EV(){return EV;},startExam,track,openMall,openProduct,openLicense,openGrow,switchBB,babyModal,tick,E,B};
})();
