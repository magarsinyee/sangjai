<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffe9d6">
<title>生仔要考牌 Parenthood Challenge</title>
<style>
:root{--wall:#ffe3c2;--wall2:#ffd2a1;--rug:#ff9fb8;--rug2:#ffc4d3;--curt:#7c6cf0;--ones:#ffd166;--shirt:#7c6cf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Arial Rounded MT Bold","PingFang HK","Microsoft JhengHei","Noto Sans HK","Heiti TC",sans-serif;color:#3b2a4a;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer}
#vp{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#ffe9d6 0 50%,#f0b47c 50%)}
#stage{position:absolute;left:0;top:0;width:1600px;height:800px;transform-origin:0 0}
#bg{position:absolute;left:0;top:0;display:block}
.ent{position:absolute;touch-action:none;cursor:grab}
.ent.lift{filter:drop-shadow(0 22px 12px rgba(0,0,0,.28));z-index:6000!important;cursor:grabbing}
.ent.fall{transition:left .35s ease-out,top .42s cubic-bezier(.55,0,.85,.55)}
.ent.glide{transition:left .6s ease-in-out,top .6s ease-in-out}
.item{width:72px;height:72px;display:flex;align-items:flex-end;justify-content:center;font-size:54px;line-height:1}
.item .em{filter:drop-shadow(0 4px 0 rgba(0,0,0,.14));display:block}
.item.float .em{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.item.hot{animation:wiggle .5s ease-in-out infinite}
@keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.hs{position:absolute;cursor:pointer;border-radius:16px}
.over{position:absolute;pointer-events:none}
#night{position:absolute;left:0;top:0;width:1600px;height:800px;background:rgba(20,16,64,.56);opacity:0;pointer-events:none;transition:opacity .7s;z-index:4000}
.off #night{opacity:1}
#lampGlow{transition:opacity .5s}
.off #lampGlow{opacity:0}
#curtL,#curtR{transform-box:fill-box;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
#curtL{transform-origin:0 50%}#curtR{transform-origin:100% 50%}
.cOpen #curtL,.cOpen #curtR{transform:scaleX(.32)}
#binLid,#toyLid{transform-box:fill-box;transform-origin:0 100%;transition:transform .25s}
.binOpen #binLid{transform:rotate(-38deg)}
.boxOpen #toyLid{transform:rotate(-40deg)}
#mobile{transform-origin:870px 0;transform-box:view-box}
.spin #mobile{animation:mob 1.6s ease-in-out infinite}
@keyframes mob{25%{transform:rotate(5deg)}75%{transform:rotate(-5deg)}}
#mobArm{transform-box:fill-box;transform-origin:50% 0}
.spin #mobArm{animation:mobArm .8s linear infinite}
@keyframes mobArm{50%{transform:scaleX(-1)}}
.radioOn #radio{animation:radio .3s ease-in-out infinite alternate}
@keyframes radio{to{transform:translateY(-3px)}}
#radio{transform-box:fill-box;transform-origin:50% 100%}
.mach #machLight{fill:#7dd87d}
.night #skyRect{fill:url(#skyN)}
.night #sunmoon{fill:#fff7cf}
.night #clouds{opacity:.25}
/* BB */
#bb{width:150px;height:170px}
#bb svg,#pa svg{display:block;width:100%;height:100%;overflow:visible}
.ones{fill:var(--ones)}.skin{fill:#ffd6b8}
.bbbody{transform-origin:75px 164px;transform-box:view-box;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.02,.98)}}
#bb.bounce .bbbody{animation:bounce .42s ease 3}
@keyframes bounce{40%{transform:translateY(-18px) scale(1.04,.96)}}
#bb.dance .bbbody{animation:dance .45s ease-in-out infinite alternate}
@keyframes dance{from{transform:rotate(-8deg)}to{transform:rotate(8deg) translateY(-8px)}}
#bb.shake .head{animation:shake .2s ease-in-out 5}
.head{transform-box:view-box;transform-origin:75px 100px}
@keyframes shake{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
#bb.cry .bbbody{animation:sob .5s ease-in-out infinite}
@keyframes sob{50%{transform:translateY(2px) scale(1.03,.97)}}
#bb.float .bbbody{animation:fl 1s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px)}}
.armL,.armR{transform-box:view-box;transition:transform .25s}
.armL{transform-origin:40px 104px}.armR{transform-origin:110px 104px}
#bb.hold .armL{transform:rotate(-40deg)}#bb.hold .armR{transform:rotate(40deg)}
#bb.wave .armR{animation:wave .3s ease-in-out 6 alternate}
@keyframes wave{from{transform:rotate(-20deg)}to{transform:rotate(-140deg)}}
.tear{animation:tear .7s ease-in infinite}
@keyframes tear{from{transform:translateY(0);opacity:1}to{transform:translateY(16px);opacity:0}}
#bb svg.stink{position:absolute;left:30px;top:-66px;width:90px;height:60px;display:none;pointer-events:none}
#bb.poop svg.stink{display:block}
.stink path{animation:stinkUp 1.4s ease-in-out infinite}
.stink path:nth-child(2){animation-delay:.45s}.stink path:nth-child(3){animation-delay:.9s}
@keyframes stinkUp{0%{transform:translateY(10px);opacity:0}40%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
.need{position:absolute;right:-26px;top:-34px;width:58px;height:58px;border-radius:50%;background:#fff;display:none;place-items:center;font-size:30px;box-shadow:0 5px 0 rgba(0,0,0,.12);animation:bob 1.6s ease-in-out infinite;pointer-events:none}
.need.show{display:grid}
/* parent */
#pa{width:170px;height:400px}
#pa .holdArms{display:none}
#pa.holding .holdArms{display:block}
#pa.holding .downArms{display:none}
#pa.wave .paArm{animation:paWave .35s ease-in-out 6 alternate}
.paArm{transform-box:view-box;transform-origin:126px 196px}
@keyframes paWave{to{transform:rotate(-120deg)}}
/* bubbles & fx */
.say{position:absolute;background:#fff;border-radius:22px;padding:10px 16px;font-size:22px;font-weight:900;white-space:nowrap;box-shadow:0 6px 0 rgba(0,0,0,.12);transform:translate(-50%,-100%);z-index:4500;pointer-events:none;animation:pop .25s cubic-bezier(.3,1.5,.5,1)}
.say:after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes pop{from{transform:translate(-50%,-80%) scale(.6);opacity:0}to{transform:translate(-50%,-100%) scale(1);opacity:1}}
.fx{position:absolute;pointer-events:none;z-index:4600;transform:translate(-50%,-50%);animation:fxUp 1.6s ease-out forwards;font-size:34px;line-height:1;white-space:nowrap}
@keyframes fxUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-420%)}}
.fx.txt{font-size:26px;font-weight:900;color:#ff4f7b;text-shadow:0 3px 0 #fff,0 -3px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff}
.fx.bird{animation:bird 2.6s linear forwards;font-size:30px}
@keyframes bird{from{transform:translate(0,0) scaleX(-1)}to{transform:translate(200px,-40px) scaleX(-1)}}
.hand{position:absolute;font-size:56px;z-index:4800;pointer-events:none;animation:handMove 2.4s ease-in-out infinite}
@keyframes handMove{0%{transform:translate(0,0);opacity:0}15%{opacity:1}70%{transform:translate(var(--hx),var(--hy));opacity:1}100%{transform:translate(var(--hx),var(--hy));opacity:0}}
.coinb{position:absolute;background:#ff4f7b;color:#fff;border-radius:999px;padding:2px 8px;font-size:18px;font-weight:900;pointer-events:none;z-index:4400;transform:translate(-50%,-100%)}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;pointer-events:none;z-index:10}
.hb{pointer-events:auto;border:0;border-radius:20px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.14);font-weight:900;padding:9px 14px;font-size:16px;display:flex;align-items:center;gap:6px;white-space:nowrap;position:relative}
.hb:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.hb .dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#ff4f7b;border:2px solid #fff;display:none}
.hb .dot.show{display:block}
#hHearts{font-size:18px}
#hHearts.pulse{animation:hpulse .4s}
@keyframes hpulse{50%{transform:scale(1.18)}}
.sp{flex:1}
#lic small{font-size:11px;color:#9a7fb0;display:block;line-height:1}
#tipbox{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);max-width:min(520px,calc(100% - 24px));background:#fff;border-radius:20px;padding:10px 16px;font-weight:900;font-size:15px;box-shadow:0 5px 0 rgba(0,0,0,.12);z-index:9;pointer-events:none;transition:opacity .3s}
#tipbox:empty{opacity:0}
#evbar{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%);background:#2b2163;color:#fff;border-radius:20px;padding:10px 16px;font-weight:900;font-size:15px;z-index:11;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.25);display:none;max-width:92%}
#evbar.show{display:block}
#evbar b{color:#ffd166;font-size:20px}
#rot{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 70px);text-align:center;font-size:13px;font-weight:800;color:#8a5a3a;z-index:8;pointer-events:none;display:none}
/* modal */
#modal{position:fixed;inset:0;background:rgba(43,33,99,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
#modal[hidden]{display:none}
.card{background:#fffaf2;border-radius:30px;padding:20px 18px;width:100%;max-width:420px;max-height:100%;overflow:auto;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.15);animation:cpop .3s cubic-bezier(.3,1.4,.5,1);touch-action:pan-y}
@keyframes cpop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:6px 0;font-size:24px}
.card p{line-height:1.6;font-size:15px;margin:6px 0}
.big{font-size:60px;line-height:1.15}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:13px;font-size:17px;font-weight:900;margin-top:10px;background:#ff4f7b;color:#fff;box-shadow:0 5px 0 #d6335d}
.btn.sec{background:#efe6f5;color:#3b2a4a;box-shadow:0 5px 0 #d8c8e3}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d6335d}
.btn:disabled{opacity:.45}
.lbl{font-weight:900;text-align:left;margin:12px 0 6px}
.opts{display:flex;gap:8px}
.opt{flex:1;border:4px solid #efe6f5;border-radius:18px;background:#fff;padding:8px 2px;font-weight:900;font-size:14px}
.opt span{display:block;font-size:32px;line-height:1.3}
.opt.on{border-color:#ff4f7b;background:#fff0f4}
input.nm{width:100%;border:4px solid #efe6f5;border-radius:16px;padding:11px;font-size:18px;font-family:inherit;font-weight:900;text-align:center;color:#3b2a4a;outline:none}
input.nm:focus{border-color:#ff4f7b}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 12px;margin-top:8px;text-align:left;box-shadow:0 4px 0 #f0e4f2}
.row .re{font-size:30px;width:40px;text-align:center}
.row div{flex:1;font-size:14px;font-weight:800}
.row small{display:block;font-weight:700;color:#9a7fb0;font-size:12px}
.row button{border:0;border-radius:14px;padding:9px 12px;font-weight:900;background:#ff4f7b;color:#fff;box-shadow:0 4px 0 #d6335d}
.row button:disabled{background:#e8dff0;color:#a593b5;box-shadow:0 4px 0 #d8c8e3}
.row.done{background:#e8fbf0}
.pb{height:10px;background:#efe6f5;border-radius:9px;overflow:hidden;margin-top:4px}
.pb i{display:block;height:100%;background:linear-gradient(90deg,#7dd8b2,#3fbfad);border-radius:9px}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;border:0;border-radius:14px;padding:9px;font-weight:900;background:#efe6f5}
.tabs button.on{background:#ff4f7b;color:#fff}
.licard{background:linear-gradient(135deg,#fff,#fff3d6);border:4px solid #3b2a4a;border-radius:18px;padding:14px;text-align:left;position:relative;margin:10px 0;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.licard .lt{font-size:12px;font-weight:900;color:#9a7fb0;letter-spacing:2px}
.licard .lc{font-size:22px;font-weight:900;margin:4px 0}
.licard .ph{position:absolute;right:14px;top:14px;width:70px;height:84px;border-radius:10px;background:#ffe3c2;display:grid;place-items:center;font-size:30px;border:3px solid #3b2a4a}
.licard p{margin:2px 0;font-size:13px}
.stamp{position:absolute;right:20px;bottom:10px;font-size:20px;font-weight:900;color:#ff4f7b;border:3px solid #ff4f7b;border-radius:10px;padding:2px 8px;transform:rotate(-12deg)}
.small{font-size:12px;color:#9a7fb0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.shopi{border:0;background:#fff;border-radius:18px;padding:10px 4px;font-weight:900;font-size:13px;box-shadow:0 4px 0 #f0e4f2}
.shopi span{display:block;font-size:34px;line-height:1.3}
.shopi small{display:block;color:#ff4f7b}
.shopi.own small{color:#3fbfad}
.shopi:disabled{opacity:.5}
.sw{display:block;height:26px;border-radius:10px;margin:2px 6px 6px;border:3px solid rgba(0,0,0,.08)}
.stat{display:grid;grid-template-columns:1fr auto;gap:6px 10px;text-align:left;font-size:14px;background:#fff;border-radius:16px;padding:12px;margin-top:8px}
.stat b{text-align:right}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translate(-50%,-10px);background:#3b2a4a;color:#fff;font-weight:900;font-size:15px;padding:10px 16px;border-radius:18px;z-index:40;opacity:0;transition:.25s;pointer-events:none;text-align:center;max-width:90%}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

 <div id="stage">

    <linearGradient id="skyD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc8ff"/><stop offset="1" stop-color="#d6f0ff"/></linearGradient>
    <linearGradient id="skyN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e2463"/><stop offset="1" stop-color="#5b4b9e"/></linearGradient>
   </defs>
   <rect width="1600" height="610" fill="url(#wp)"/>

   <ellipse cx="820" cy="718" rx="350" ry="64" fill="var(--rug)"/>

   <rect x="254" y="68" width="232" height="16" rx="8" fill="#c98d5e"/>

   <!-- radio -->
   <g id="radio"><path d="M420 270l20 -22" stroke="#3b2a4a" stroke-width="4" stroke-linecap="round"/><rect x="398" y="270" width="68" height="48" rx="12" fill="#ff6b8b"/><circle cx="418" cy="294" r="13" fill="#3b2a4a"/><circle cx="418" cy="294" r="6" fill="#ff6b8b"/><rect x="438" y="282" width="20" height="8" rx="4" fill="#fff"/><rect x="438" y="298" width="20" height="8" rx="4" fill="#ffd166"/></g>

   <rect x="20" y="440" width="220" height="160" rx="18" fill="#ff8c69"/>

   <rect x="200" y="390" width="22" height="36" rx="8" fill="#7dd8b2"/><rect x="204" y="382" width="14" height="10" rx="3" fill="#3fbfad"/>

   <rect x="500" y="450" width="200" height="150" rx="16" fill="#f6c453"/>

   <circle cx="580" cy="530" r="5" fill="#fff"/><circle cx="620" cy="530" r="5" fill="#fff"/>
   <rect x="492" y="436" width="216" height="20" rx="10" fill="#fff"/>

   <g id="bowl"><circle cx="648" cy="410" r="13" fill="#ff5d5d"/><path d="M642 398q4 -8 10 -6" stroke="#5a8f3a" stroke-width="3" fill="none"/><path d="M660 414q18 -26 34 -10q-16 -2 -34 10z" fill="#ffd34d"/><path d="M628 418q42 42 84 0z" fill="#7c6cf0"/></g>
   <!-- clock -->

let drag=null;

 if(EV&&EV.over)return;
 e.preventDefault();e.stopPropagation();au();
 const p=toStage(e);
 const ent=id==='bb'?{kind:'bb'}:id==='pa'?{kind:'pa'}:E[id];
 if(!ent||ent.kind==='parcel')return;
 if(ent.kind==='item'&&ent.it.busy)return;
 if(ent.kind==='bb'&&R.busy)return;
 const obj=ent.kind==='bb'?S.bb:ent.kind==='pa'?{x:S.pa.x,y:792}:ent.it;
 drag={id,ent,pid:e.pointerId,sx:e.clientX,sy:e.clientY,ox:obj.x-p.x,oy:obj.y-p.y,moved:false,el:$(id)};
 try{$(id).setPointerCapture(e.pointerId);}catch(_){}
}
function startLift(){
 const d=drag;d.moved=true;d.el.classList.remove('fall','glide');d.el.classList.add('lift');SND.pick();
 if(d.ent.kind==='bb'){
  const b=S.bb;if(b.asleep){wake(true);}if(b.loc==='held'){$('pa').classList.remove('holding');}b.loc='lift';
  setFace('wide','o');
 }
 if(d.ent.kind==='item'&&d.ent.it.inBox)d.ent.it.inBox=false;
 hideHint();
}
addEventListener('pointermove',e=>{
 if(pan&&e.pointerId===pan.pid){offX=clamp(pan.ox+(e.clientX-pan.sx),Math.min(0,innerWidth-SW*scale),0);applyStage();return;}
 if(!drag||e.pointerId!==drag.pid)return;
 if(!drag.moved){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<8)return;startLift();}
 drag.lx=e.clientX;
 const p=toStage(e),k=drag.ent.kind;
 if(k==='pa'){S.pa.x=clamp(p.x+drag.ox,90,1510);drawPA();if(S.bb.loc==='held')drawBB();return;}
 const x=clamp(p.x+drag.ox,30,1570),y=clamp(p.y+drag.oy,60,795);
 if(k==='bb'){S.bb.x=x;S.bb.y=y;placeEl(drag.el,x,y,150,170,6000);}
 else{const it=drag.ent.it;it.x=x;it.y=y;placeEl(drag.el,x,y,72,72,6000);hoverHint(it,p);}
});
function endDrag(e){
 if(pan&&e.pointerId===pan.pid){pan=null;return;}
 if(!drag||e.pointerId!==drag.pid)return;
 const d=drag;drag=null;d.el.classList.remove('lift');
 const k=d.ent.kind;
 if(!d.moved){
  if(k==='bb')tapBB();else if(k==='pa')tapPA();else tapItem(d.ent.it);
  return;
 }
 const p=toStage(e);SND.drop();
 if(k==='bb')dropBB(p);else if(k==='pa'){drawPA();save();}
 else dropItem(d.ent.it,p);
 clearHover();
}

vp.addEventListener('pointerdown',e=>{if(drag)return;au();pan={pid:e.pointerId,sx:e.clientX,ox:offX};});

const Z={crib:{x:745,y:370,w:255,h:235},tub:{x:1100,y:430,w:200,h:175},chair:{x:1318,y:360,w:130,h:150},bin:{x:240,y:480,w:110,h:130},mach:{x:500,y:345,w:110,h:105},box:{x:1450,y:470,w:140,h:135}};
const SURF=[{a:30,b:230,y:252},{a:262,b:478,y:322},{a:14,b:246,y:428},{a:494,b:706,y:440},{a:762,b:980,y:548},{a:1130,b:1270,y:522},{a:1320,b:1446,y:448}];
function restY(p){if(p.y>=600)return clamp(p.y,630,792);let best=null;for(const s of SURF)if(p.x>=s.a&&p.x<=s.b&&s.y>=p.y-30&&(!best||s.y<best.y))best=s;return best?best.y:clamp(700+rand(-30,40),630,792);}

function dropItem(it,p){
 if(inR(p,bbRect())&&S.bb.loc!=='lift')return useOnBB(it);
 if(inR(p,Z.bin))return toBin(it);

 if(R.busy)return settle(it,nearBB());

 switch(it.t){
  case 'bottle':
   if(it.lv<=0)return refuseItem(it,'空樽嚟㗎！😤');
   if(n.hunger>85)return refuseItem(it,'唔肚餓呀～');
   return drink(it);
  case 'jar':
   if(!it.full)return refuseItem(it,'已經食晒喇！');
   if(n.hunger>85)return refuseItem(it,'飽飽，唔食喇');
   return eat(it);
  case 'diaper':
   if(!b.poop){bbSay('未屙住，唔使換 😂',1500);return settle(it,nearBB());}
   return change(it);
  case 'dirty':return refuseItem(it,'咦～好臭！🤢');
  case 'sponge':
   R.busy=true;attachToBB(it,30,-110);setFace('closed','grin');SND.splash();burst('🫧',3,b.x,b.y-110);
   setTimeout(()=>{R.busy=false;if(b.smudge){b.smudge=false;addHearts(2,b.x,b.y-170);bbSay('塊面乾淨晒 ✨');}else{n.clean=Math.min(100,n.clean+8);bbSay('痕痕地 😆');}releaseFromBB(it);idleFace();},1400);
   return;

 let k=0;const iv=setInterval(()=>{k++;it.lv=Math.max(0,1-k/8);refreshItem(it);SND.gulp();setFace('closed',k%2?'o':'suck');if(k>=8){clearInterval(iv);done();}},300);

function play(it){

/* ========== 任務 / 牌照 / 成就 ========== */
function progOf(k){if(k==='days')return Object.keys(S.m.days).length;return S.lic.prog[k]||0;}
function track(k,n){
 n=n||1;S.cnt[k]=(S.cnt[k]||0)+n;
 const L=LICENSES[S.lic.cur];if(L&&!L.future&&L.tasks.some(t=>t.k===k))S.lic.prog[k]=(S.lic.prog[k]||0)+n;
 if(S.daily)for(const t of S.daily.tasks)if(t.k===k&&!t.done){t.p=Math.min(t.n,(t.p||0)+n);if(t.p>=t.n){t.done=true;addHearts(10);toast(`📋 今日任務完成：${t.t}　+10 ❤️`);}}
 if(S.daily&&!S.daily.bonus&&S.daily.tasks.every(t=>t.done)){S.daily.bonus=true;setTimeout(()=>{addHearts(15);toast('🌟 今日 3 個任務全部完成！+15 ❤️',3000);},1500);}
 checkAch();checkLicense();renderHUD();
}
function checkAch(){for(const a of ACH){const v=a.k==='days'?Object.keys(S.m.days).length:(S.cnt[a.k]||0);if(!S.ach[a.k]&&v>=a.n){S.ach[a.k]=now();setTimeout(()=>toast(`🏅 獲得成就：${a.em} ${a.name}`,3000),800);}}}
function checkLicense(){
 const L=LICENSES[S.lic.cur];if(!L||L.future)return;
 if(L.tasks.every(t=>progOf(t.k)>=t.n)){
  S.lic.passed.push({id:L.id,t:now()});S.lic.cur++;S.lic.prog={};S.hearts+=L.hearts;save();
  setTimeout(()=>{SND.win();showCert(L,true);},1200);
 }
}
function certHTML(L,t){const pn=S.parent==='mum'?'媽媽':'爸爸';return `<div class="licard"><div class="lt">BB考牌局・遊戲牌照</div><div class="lc">${L.em} ${L.name}</div><p>持牌人：<b>${S.name}嘅${pn}</b></p><p>發牌日期：${new Date(t).toLocaleDateString('zh-HK')}</p><p>考牌官：${S.name}（簽名：一啖口水）</p><div class="ph">${S.parent==='mum'?'👩':'👨'}</div><div class="stamp">合格</div></div>`;}
function showCert(L,isNew){const p=S.lic.passed.find(x=>x.id===L.id);modal(`<div class="big">${isNew?'🎉':'🪪'}</div><h2>${isNew?'考牌成功！':'我的牌照'}</h2>${certHTML(L,p?p.t:now())}${isNew?`<p>獎勵：<b>+${L.hearts} ❤️</b>・${L.reward}</p>${LICENSES[S.lic.cur]&&!LICENSES[S.lic.cur].future?`<p>下一關：<b>${LICENSES[S.lic.cur].name}</b></p>`:''}`:''}<p class="small">牌照只反映遊戲挑戰進度，唔代表現實育兒能力 😉</p>`,[{t:'好嘢！'}]);renderHUD();}
function newDay(){
 const today=dk();
 if(S.daily&&S.daily.day===today)return false;
 const pool=DAILY_POOL.slice().sort(()=>Math.random()-.5).slice(0,3).map(t=>({...t,p:0,done:false}));
 S.daily={day:today,tasks:pool,bonus:false,gift:false};
 const y=dk(now()-86400000);S.streak.n=S.streak.last===y?S.streak.n+1:1;S.streak.last=today;
 return true;
}

/* ========== 時間流逝 ========== */
const RATE={hunger:3,sleep:2,clean:1.2,fun:2.5};
let sec=0;
function tick(){
 if(!S)return;sec++;
 const b=S.bb,n=S.needs;
 for(const k in RATE){
  if(k==='sleep'&&b.asleep){n.sleep=Math.min(100,n.sleep+(S.lightsOff?4:2.6));continue;}
  let r=RATE[k];if(k==='fun'&&(S.radio||b.loc==='held'))r*=.3;if(b.asleep&&k!=='hunger')r*=.4;
  n[k]=Math.max(0,n[k]-r/60);
 }
 if(b.asleep&&n.sleep>=100&&!(EV&&!EV.over))wake();
 if(R.yawn&&now()>R.yawn){R.yawn=0;if(b.loc==='crib'&&!isCryingOther())fallAsleep();}
 if(!b.poop&&!(EV&&!EV.over)&&!R.busy&&Math.random()<(now()-(R.lastFeedT||0)<120000?1/50:1/400)){b.poop=true;n.clean=Math.min(n.clean,15);SND.pop();if(!b.asleep)bbSay('噗噗… 💩',1600);paSay(pick(['又屙…？','原來BB屙屎可以咁大聲 😂']),2000);}
 if(b.asleep&&b.loc==='crib'&&S.lightsOff&&S.lic.cur>=1&&S.lastNight!==dk()&&!EV){R.sleepSec++;if(R.sleepSec===15&&Math.random()<.5){S.lastNight=dk();start3am();}else if(R.sleepSec===15)S.lastNight=dk();}
 if(b.asleep&&sec%3===0)fx('💤',b.x+50,b.y-150);
 const cry=isCrying();
 if(cry&&!R.cryStart)R.cryStart=now();
 if(!cry&&R.cryStart){if(now()-R.cryStart<=30000&&!EV)track('calm');R.cryStart=0;}
 if(cry&&!R.busy&&now()-R.lastSob>5000){R.lastSob=now();SND.sob();}
 if(EV&&EV.started&&!EV.over){EV.t-=1;renderEv();if(EV.t<=0)evFail();}
 S.piggy=Math.min(40,S.piggy+1/180);if(sec%5===0)renderPiggy();
 if(!R.busy&&now()-(R.lastAct||0)>1600)idleFace();
 renderNeed();renderTip();updateClock();
 if(newDay()){renderGift();renderHUD();checkLicense();toast('☀️ 新一日！每日禮物同任務已更新');}
 S.m.days[dk()]=1;const ss=S.m.sess[S.m.sess.length-1];if(ss)ss.e=now();
 if(sec%5===0)save();
 if(sec%20===0&&!R.busy&&!b.asleep&&!cry&&Math.random()<.5)idleAnim();
}
function idleAnim(){const r=Math.random();if(r<.4){bbEl().classList.add('wave');setTimeout(()=>bbEl().classList.remove('wave'),2000);bbSay(pick(['啊～','咿！','咕咕']),1200);}else if(r<.7){setFace('happy','smile');setTimeout(idleFace,900);}else{bbCls('bounce',1200);}}
function renderNeed(){
 const el=bbEl().querySelector('.need'),b=S.bb;
 if(b.asleep||R.busy){el.classList.remove('show');return;}
 if(EV&&!EV.over){el.textContent='❓';el.classList.add('show');return;}
 let ic=null;const n=S.needs;
 if(b.poop)ic='💩';else if(n.hunger<35)ic='🍼';else if(n.sleep<30)ic='😪';else if(n.clean<35||b.smudge)ic='🛁';else if(n.fun<35)ic='🧸';else if(b.needBurp>now())ic='👋';
 el.textContent=ic||'';el.classList.toggle('show',!!ic);
}
function tipText(){
 if(EV&&!EV.over)return '🌙 搵出BB要咩！睇住BB同上面嘅線索';
 const b=S.bb,n=S.needs;
 if(!S.seenHint&&!(S.cnt.feed))return '👆 將奶樽拖去BB度餵奶';
 if(b.asleep)return '💤 BB瞓緊… 可以執吓房、收錢罌';
 if(b.poop)return '💩 BB屙咗！喺換片枱攞尿片，拖落BB度';
 if(S.items.some(i=>i.t==='dirty'))return '🗑️ 將臭尿片拖落垃圾桶';
 if(b.needBurp>now())return `👋 掃風：快速輕拍BB三下${b.loc==='held'?'':'（抱住佢只要兩下）'}`;
 if(n.hunger<35){const bt=S.items.find(i=>i.t==='bottle');return bt&&bt.lv<=0?'🍼 奶樽空咗，拖落沖奶機斟奶':'🍼 BB肚餓：拖奶樽或者果蓉（㩒生果碗）畀佢';}
 if(n.sleep<30)return '😪 BB眼瞓：抱佢入BB床，熄燈或者㩒床鈴會快啲瞓';
 if(n.clean<35||b.smudge)return '🛁 BB污糟：抱佢落浴盆，或者用海綿抹面';
 if(n.fun<35)return '🧸 BB悶：拖玩具畀佢、開收音機，或者抱抱佢';
 if(Math.floor(S.piggy)>=10)return `🐷 錢罌儲咗 ${Math.floor(S.piggy)} ❤️，㩒佢收錢`;
 if(giftReady())return '🎁 今日禮物喺地下，㩒佢拆！';
 return '';
}
function renderTip(){const t=tipText();if($('tipbox').textContent!==t)$('tipbox').textContent=t;}

/* ========== HUD & 視窗 ========== */
function renderHUD(){
 $('hHearts').textContent='❤️ '+S.hearts;
 const L=LICENSES[S.lic.cur];
 if(L&&!L.future){const tot=L.tasks.reduce((a,t)=>a+t.n,0),got=L.tasks.reduce((a,t)=>a+Math.min(t.n,progOf(t.k)),0);$('lic').innerHTML=`🚗 ${L.id}牌<small>${got}/${tot}</small>`;}
 else $('lic').innerHTML=`🚗 已考 ${S.lic.passed.length} 張<small>下版再考</small>`;
 $('dTask').classList.toggle('show',!!(S.daily&&(!S.daily.gift||S.daily.tasks.some(t=>t.done&&!t.seen))));
}
const MQ=[];let mOpen=false;
function modal(html,btns,onShow){MQ.push({html,btns,onShow});if(!mOpen)nextModal();}
function nextModal(){const m=MQ.shift();if(!m){mOpen=false;$('modal').hidden=true;return;}mOpen=true;const c=$('card');c.innerHTML=m.html;(m.btns||[]).forEach(b=>{const e=document.createElement('button');e.className='btn '+(b.cls||'');e.textContent=b.t;if(b.dis)e.disabled=true;e.onclick=()=>{au();SND.pop();const r=b.f&&b.f();if(r!==false)nextModal();};c.appendChild(e);});$('modal').hidden=false;c.scrollTop=0;if(m.onShow)m.onShow(c);}
function closeModal(){MQ.length=0;nextModal();}
function openLicense(){
 const L=LICENSES[S.lic.cur];
 let h=`<div class="big">🚗</div><h2>生仔要考牌</h2><p class="small">完成挑戰就考到牌！考唔到可以重考，冇人會肥佬 😉</p>`;
 if(L&&!L.future){h+=`<div class="row"><div class="re">${L.em}</div><div>而家考緊：${L.name}<small>獎勵：${L.reward}・+${L.hearts} ❤️</small></div></div>`;
  for(const t of L.tasks){const v=Math.min(t.n,progOf(t.k));h+=`<div class="row ${v>=t.n?'done':''}"><div class="re">${v>=t.n?'✅':'⬜'}</div><div>${t.t}<div class="pb"><i style="width:${v/t.n*100}%"></i></div></div><b>${v}/${t.n}</b>${t.k==='night3'&&v<t.n?'<button id="go3">挑戰</button>':''}</div>`;}
 }
 h+=`<p class="lbl">全部牌照</p>`;
 LICENSES.forEach((l,i)=>{const passed=S.lic.passed.find(p=>p.id===l.id);h+=`<div class="row ${passed?'done':''}"><div class="re">${l.em}</div><div>${l.name}<small>${passed?'已考到 ✅（㩒睇證書）':i===S.lic.cur&&!l.future?'考緊':l.future?'Version 1.0 推出':'未解鎖'}</small></div>${passed?`<button data-cert="${l.id}">證書</button>`:''}</div>`;});
 h+=`<p class="lbl">成就</p><div class="grid">${ACH.map(a=>`<div class="shopi ${S.ach[a.k]?'own':''}" style="${S.ach[a.k]?'':'opacity:.45'}"><span>${S.ach[a.k]?a.em:'🔒'}</span>${a.name}</div>`).join('')}</div>`;
 modal(h,[{t:'返回'}],c=>{const g=c.querySelector('#go3');if(g)g.onclick=()=>{closeModal();setTimeout(start3am,200);};c.querySelectorAll('[data-cert]').forEach(b=>b.onclick=()=>{const l=LICENSES.find(x=>x.id===b.dataset.cert);closeModal();setTimeout(()=>showCert(l,false),100);});});
}
function openTasks(){
 const d=S.daily;
 let h=`<div class="big">📋</div><h2>今日任務</h2><p class="small">每日更新・連續返嚟 <b>${S.streak.n}</b> 日</p>`;
 h+=`<div class="row ${d.gift?'done':''}"><div class="re">🎁</div><div>每日禮物<small>${d.gift?'今日已拆':'喺房間地下，㩒佢拆！'}</small></div></div>`;
 for(const t of d.tasks){t.seen=true;h+=`<div class="row ${t.done?'done':''}"><div class="re">${t.done?'✅':'⬜'}</div><div>${t.t}<div class="pb"><i style="width:${(t.p||0)/t.n*100}%"></i></div></div><b>${t.p||0}/${t.n}</b></div>`;}
 h+=`<div class="row ${d.bonus?'done':''}"><div class="re">🌟</div><div>3 個全部完成<small>額外 +15 ❤️</small></div></div><p class="small">🐷 錢罌每 3 分鐘自動儲 1 ❤️（最多 40），離開遊戲都會儲。</p>`;
 modal(h,[{t:'返去BB房'}]);renderHUD();
}
function openShop(tab){
 tab=tab||'toy';
 let h=`<div class="big">🛒</div><h2>商店</h2><p class="small">用 ❤️ 愛心換（你有 <b>${S.hearts}</b> ❤️）</p><div class="tabs"><button data-tab="toy" class="${tab==='toy'?'on':''}">玩具</button><button data-tab="room" class="${tab==='room'?'on':''}">裝飾</button></div><div class="grid">`;
 if(tab==='toy')for(const k of SHOP_TOYS){const t=IT[k],own=S.owned[k];h+=`<button class="shopi ${own?'own':''}" data-buy="${k}" ${own||S.hearts<t.price?'disabled':''}><span>${t.em}</span>${t.name}<small>${own?'已擁有':t.price+' ❤️'}</small></button>`;}
 else{
  for(const [k,w] of Object.entries(WALLS)){const own=S.walls[k];h+=`<button class="shopi ${own?'own':''}" data-wall="${k}" ${!own&&S.hearts<w.p?'disabled':''}><i class="sw" style="background:${w.c[0]}"></i>${w.n}牆紙<small>${S.wall===k?'使用中':own?'已擁有':w.p+' ❤️'}</small></button>`;}
  for(const [k,w] of Object.entries(RUGS)){const own=S.rugs[k];h+=`<button class="shopi ${own?'own':''}" data-rug="${k}" ${!own&&S.hearts<w.p?'disabled':''}><i class="sw" style="background:${w.c[0]};border-radius:50%"></i>${w.n}地氈<small>${S.rug===k?'使用中':own?'已擁有':w.p+' ❤️'}</small></button>`;}
  for(const [k,d] of Object.entries(DECO)){const own=S.deco[k];h+=`<button class="shopi ${own?'own':''}" data-deco="${k}" ${!own&&S.hearts<d.p?'disabled':''}><span>${d.em}</span>${d.n}<small>${own?(S.decoOn[k]?'擺咗 ✅':'收起咗'):d.p+' ❤️'}</small></button>`;}
 }
 h+=`</div><p class="small">商店只賣外觀同玩具，唔會令BB「更健康」或者「成長更快」。</p>`;
 modal(h,[{t:'返回'}],c=>{
  c.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{closeModal();setTimeout(()=>openShop(b.dataset.tab),50);});
  c.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const k=b.dataset.buy,t=IT[k];if(S.hearts<t.price)return;S.hearts-=t.price;S.owned[k]=1;let px=clamp(S.bb.x+170,100,1500);if(Math.abs(px-660)<100)px+=140;const p={t:k,x:px,y:775};S.parcels.push(p);spawnParcel(p);SND.win();toast(`📦 ${t.name}送到喇！喺地下㩒個包裹拆開`);save();renderHUD();closeModal();focusX(p.x);});
  const re=()=>{save();renderRoom();renderHUD();closeModal();setTimeout(()=>openShop('room'),50);};
  c.querySelectorAll('[data-wall]').forEach(b=>b.onclick=()=>{const k=b.dataset.wall;if(!S.walls[k]){if(S.hearts<WALLS[k].p)return;S.hearts-=WALLS[k].p;S.walls[k]=1;SND.win();}S.wall=k;re();});
  c.querySelectorAll('[data-rug]').forEach(b=>b.onclick=()=>{const k=b.dataset.rug;if(!S.rugs[k]){if(S.hearts<RUGS[k].p)return;S.hearts-=RUGS[k].p;S.rugs[k]=1;SND.win();}S.rug=k;re();});
  c.querySelectorAll('[data-deco]').forEach(b=>b.onclick=()=>{const k=b.dataset.deco;if(!S.deco[k]){if(S.hearts<DECO[k].p)return;S.hearts-=DECO[k].p;S.deco[k]=1;S.decoOn[k]=1;SND.win();}else S.decoOn[k]=!S.decoOn[k];re();});
 });
}
function metrics(){
 const ss=S.m.sess,days=Object.keys(S.m.days).sort();
 const dur=ss.map(s=>(s.e-s.s)/60000).filter(x=>x>=0);
 const avg=dur.length?dur.reduce((a,b)=>a+b,0)/dur.length:0;
 const first=dk(S.m.first),d1=dk(S.m.first+86400000);
 return {first,days:days.length,sess:ss.length,avg:avg.toFixed(1),total:dur.reduce((a,b)=>a+b,0).toFixed(0),d1:S.m.days[d1]?'有 ✅':(dk()<=first?'未到第2日':'冇'),streak:S.streak.n,feeds:S.cnt.feed||0,toys:S.cnt.toy||0,lic:S.lic.passed.length,ach:Object.keys(S.ach).length,dates:days};
}
function openSettings(){
 const m=metrics();
 modal(`<div class="big">⚙️</div><h2>設定</h2>
 <div class="row"><div class="re">${S.parent==='mum'?'👩':'👨'}</div><div>${S.name}嘅${S.parent==='mum'?'媽媽':'爸爸'}<small>BB：${{boy:'男仔',girl:'女仔',none:'唔選擇'}[S.gender]}</small></div></div>
 <p class="lbl">📊 測試數據（驗證玩家會唔會主動返嚟）</p>
 <div class="stat"><span>第一次玩</span><b>${m.first}</b><span>玩過嘅日數</span><b>${m.days} 日</b><span>第 2 日有冇返嚟（D1）</span><b>${m.d1}</b><span>連續日數</span><b>${m.streak}</b><span>開咗幾多次</span><b>${m.sess} 次</b><span>平均每次玩</span><b>${m.avg} 分鐘</b><span>總共玩咗</span><b>${m.total} 分鐘</b><span>餵奶／玩玩具</span><b>${m.feeds}／${m.toys}</b><span>牌照／成就</span><b>${m.lic}／${m.ach}</b></div>
 <p class="small">數據只儲喺呢部機，冇上傳。</p>`,
 [{t:'📋 複製測試數據 (JSON)',cls:'sec',f:()=>{const txt=JSON.stringify({...m,cnt:S.cnt,sessions:S.m.sess},null,1);try{navigator.clipboard.writeText(txt).then(()=>toast('已複製'),()=>toast('複製唔到，請截圖'));}catch(_){toast('複製唔到，請截圖');}return false;}},
  {t:S.muted?'🔇 音效：關':'🔊 音效：開',cls:'sec',f:()=>{S.muted=!S.muted;if(S.muted)stopMusic();else if(S.radio)playMusic('radio');save();setTimeout(openSettings,50);}},
  {t:'🗑️ 重新開始',cls:'sec',f:()=>{setTimeout(()=>modal('<div class="big">🗑️</div><h2>確定清除所有進度？</h2>',[{t:'確定',f:()=>{try{localStorage.removeItem(KEY);}catch(_){}location.reload();}},{t:'取消',cls:'sec'}]),50);}},
  {t:'返回'}]);
}
$('hHearts').onclick=()=>{au();openShop();};$('lic').onclick=()=>{au();openLicense();};$('bTask').onclick=()=>{au();openTasks();};$('bShop').onclick=()=>{au();openShop();};$('bSet').onclick=()=>{au();openSettings();};
['hud','evbar'].forEach(id=>$(id).addEventListener('pointerdown',e=>e.stopPropagation()));
$('modal').addEventListener('pointerdown',e=>e.stopPropagation());

/* ========== 新手提示 ========== */
function showHint(){
 if(S.seenHint||S.cnt.feed)return;
 const bt=S.items.find(i=>i.t==='bottle');if(!bt)return;
 const h=document.createElement('div');h.className='hand';h.textContent='👆';h.id='hand';
 h.style.left=(bt.x-10)+'px';h.style.top=(bt.y-30)+'px';h.style.setProperty('--hx',(S.bb.x-bt.x)+'px');h.style.setProperty('--hy',(S.bb.y-100-bt.y)+'px');stage.appendChild(h);
}
function hideHint(){if($('hand')){$('hand').remove();S.seenHint=true;}}

/* ========== 開始 ========== */
function buildWorld(){
 const bb=mkEnt('bb','',bbSVG(),150,170);const pa=mkEnt('pa','',paSVG(S.parent==='mum'),170,400);
 drawPA();
 if(S.bb.loc==='lift')S.bb.loc='floor';
 if(S.bb.loc==='held')pa.classList.add('holding');
 drawBB();
 for(const it of S.items){it.busy=false;it.held=false;spawnItem(it);}
 for(const p of S.parcels)spawnParcel(p);
 renderRoom();renderGift();renderHUD();updateClock();setFace('open','smile');idleFace();
 focusX(S.bb.x);
}
function setupModal(){
 const st={parent:'mum',gender:'none'};
 modal(`<div class="big">👶🚗</div><h2>生仔要考牌</h2><p class="small">Parenthood Challenge</p>
  <p class="lbl">你係：</p><div class="opts" data-g="parent"><button class="opt on" data-v="mum"><span>👩</span>媽媽</button><button class="opt" data-v="dad"><span>👨</span>爸爸</button></div>
  <p class="lbl">BB係：</p><div class="opts" data-g="gender"><button class="opt" data-v="boy"><span>💙</span>男仔</button><button class="opt" data-v="girl"><span>💗</span>女仔</button><button class="opt on" data-v="none"><span>💛</span>唔選擇</button></div>
  <p class="lbl">BB叫咩名？</p><input class="nm" id="nm" maxlength="8" placeholder="例如：豆豆">`,
  [{t:'BB出世喇！▶',f:()=>{const nm=($('nm').value||'').trim().slice(0,8)||'豆豆';S=newSave({name:nm,...st});newDay();S.m.sess.push({s:now(),e:now()});S.m.days[dk()]=1;save();buildWorld();
    setTimeout(()=>modal(`<div class="big">🚨</div><h2>恭喜你！BB出世啦！</h2><p>歡迎參加《生仔要考牌》！</p><p>你以為湊BB只係餵奶、換片、氹瞓覺？<br><b>真正嘅挑戰，依家先開始！</b></p><p class="small">房入面所有嘢都可以拖嚟拖去、㩒吓試吓。<br>拖BB去唔同地方，佢會有唔同反應。</p>`,[{t:`開始照顧${nm} 💪`,f:()=>{setTimeout(showHint,400);}}]),100);}}],
  c=>{c.querySelectorAll('.opts').forEach(g=>g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st[g.dataset.g]=b.dataset.v;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));SND.pop();}));});
}
function welcomeBack(){
 const gap=(now()-S.lastSeen)/60000;
 const el=Math.min(gap,24*60);
 for(const k in RATE)S.needs[k]=Math.max(15,S.needs[k]-Math.min(45,RATE[k]*el));
 S.piggy=Math.min(40,S.piggy+el/3);
 if(S.bb.asleep&&gap>2){S.bb.asleep=false;}
 if(gap>=20){
  const lines=[`${S.name}自己同熊仔講咗好耐嘢 🧸`,`${S.name}望住窗外啲雀仔笑咗好耐 🐦`,`${S.name}試吓翻身，差少少就成功 💪`,`${S.name}喺夢入面笑出聲 😴`,`${S.name}一直望住門口等你 🥺`];
  const h=gap>=60?Math.floor(gap/60)+' 個鐘':Math.floor(gap)+' 分鐘';
  setTimeout(()=>modal(`<div class="big">👶💕</div><h2>你返嚟喇！</h2><p>你走咗 ${h}，</p><p>${pick(lines)}</p><p>🐷 錢罌儲咗 <b>${Math.floor(S.piggy)}</b> ❤️，記得㩒佢收！${giftReady()?'<br>🎁 今日禮物喺地下等你拆！':''}</p>`,[{t:`去睇${S.name} 💗`}]),400);
 }
}
load();
layout();
if(S&&S.v===1){
 S.m.sess.push({s:now(),e:now()});
 welcomeBack();newDay();buildWorld();setTimeout(checkLicense,1500);
}else{S=null;setupModal();}
buildHotspots();
setInterval(tick,1000);
(function raf(){autoPan();requestAnimationFrame(raf);})();
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();stopMusic();}else if(S&&S.radio)playMusic('radio');});
addEventListener('pagehide',save);
window.__g={focusX,get S(){return S;},R,get EV(){return EV;},start3am,track,openShop,openLicense,useOnBB,dropBB,dropItem,tapBB,E,tick};
})();
